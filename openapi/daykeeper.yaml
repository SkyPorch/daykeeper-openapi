openapi: 3.1.0
info:
  title: Daykeeper Management API
  version: 1.8.0
  summary: Safe, multi-tenant support administration for people and agents.
  description: |
    Daykeeper owns tenant lifecycle, support-channel provisioning, durable
    operations, and versioned flows. Mutations that create external resources
    use plan/apply and idempotency. Infrastructure-provider credentials and
    identifiers are never part of this contract.
  contact:
    name: SkyPorch
    url: https://github.com/SkyPorch/daykeeper-openapi
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: https://api.daykeeper.example
    description: Placeholder origin; SDK consumers configure their deployed Daykeeper origin.
tags:
  - name: Profile and workspaces
    description: Identity and connected workspace for the authenticated person.
  - name: Customer email
    description: Human-owner settings for customer email updates.
  - name: Capabilities
    description: Runtime feature and schema discovery.
  - name: Entitlements
    description: Current-organization admission policy and enforced-resource discovery.
  - name: Usage
    description: Organization-wide recorded resource-safety counters, not billing or traffic admission.
  - name: Agent credentials
    description: Reveal-once, owner-managed credentials for headless workloads that cannot use hosted OAuth.
  - name: Tenants
    description: Tenant planning, provisioning, and observed state.
  - name: Customer sessions
    description: Short-lived customer and service tokens for a tenant gateway.
  - name: Email channels
    description: Email-domain planning, DNS evidence, and round-trip readiness.
  - name: Website channels
    description: First-inbox preparation and observed installation readiness.
  - name: Web messenger
    description: Allowed websites and the publishable key a tenant's web messenger boots with.
  - name: Domain verification
    description: DNS observation and durable domain-proof evidence; never traffic activation.
  - name: API inbox activation
    description: Machine-owner activation receipts for API inbox traffic.
  - name: Operator conversations
    description: Tenant-scoped support conversation inspection and replies.
  - name: Operations
    description: Durable, inspectable provisioning work.
  - name: Flows
    description: Versioned, immutable support-flow management.
  - name: Workspace claims
    description: Machine-owner invitations that hand an agent-created workspace to a person as owner.
security:
  - daykeeperOAuth:
      - daykeeper.accounts:read
paths:
  /v1/profile:
    get:
      operationId: getProfile
      summary: Read the authenticated person's profile and connected workspace
      description: |
        Requires daykeeper.accounts:read. Returns only the person and
        workspace bound to the access token. The caller cannot select or
        change the active workspace through this endpoint.
      tags: [Profile and workspaces]
      security:
        - daykeeperOAuth: [daykeeper.accounts:read]
      responses:
        "200":
          description: The authenticated person's profile.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces available to the authenticated person
      description: |
        Requires daykeeper.accounts:read. The current workspace remains the
        one bound to the access token. This list cannot be used to change it;
        reconnect through the host to use another workspace.
      tags: [Profile and workspaces]
      security:
        - daykeeperOAuth: [daykeeper.accounts:read]
      responses:
        "200":
          description: Workspaces available to the authenticated person.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResponse"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Inspect enabled API capabilities
      tags: [Capabilities]
      security:
        - daykeeperOAuth:
            - daykeeper.accounts:read
      responses:
        "200":
          description: Enabled capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/entitlements:
    get:
      operationId: getEntitlements
      summary: Inspect the current organization's entitlements
      description: |
        Requires a verified Daykeeper access token with daykeeper.accounts:read.
        The organization comes only from the authenticated principal; there is
        no organization selector. A tenant-bound principal with this scope also
        receives organization-wide tenant occupancy, not a tenant-local count.

        Unconfigured, revoked, and exhausted assignments are successful status
        reads, not HTTP policy errors. This read neither assigns an entitlement
        nor reserves capacity. The returned policy is a provisioning safeguard,
        not approved marketing pricing or general tier activation. The legacy
        metering fields describe this admission-only contract, not optional
        provider enforcement. Use /v1/usage
        for recorded resource counters; neither read proves traffic readiness.
      tags: [Entitlements]
      security:
        - daykeeperOAuth:
            - daykeeper.accounts:read
      responses:
        "200":
          description: The authenticated organization's current admission status.
          headers:
            Cache-Control:
              description: Entitlement status must not be cached.
              schema:
                type: string
                const: no-store
            X-Request-Id:
              description: Correlation identifier shared with support and audit logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementStatusResponse"
              examples:
                available:
                  summary: Provisional policy with capacity for one new tenant
                  value:
                    data:
                      organizationId: 10000000-0000-4000-8000-000000000001
                      state: active
                      assignmentVersion: 1
                      policy:
                        version: free-2026-08-31
                        plan: free
                        provisional: true
                        tenantLimit: 1
                      tenantProvisioning:
                        enforced: true
                        allowed: true
                        used: 0
                        limit: 1
                        remaining: 1
                        denial: null
                      metering:
                        conversations: not_enforced
                        storage: not_enforced
                unconfigured:
                  summary: No assignment; reading status does not activate a plan
                  value:
                    data:
                      organizationId: 10000000-0000-4000-8000-000000000001
                      state: unconfigured
                      assignmentVersion: null
                      policy: null
                      tenantProvisioning:
                        enforced: true
                        allowed: false
                        used: 0
                        limit: null
                        remaining: null
                        denial:
                          code: ENTITLEMENT_REQUIRED
                          retryable: false
                          nextActions:
                            - inspect_entitlements
                            - contact_organization_owner
                      metering:
                        conversations: not_enforced
                        storage: not_enforced
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
          description: The access token lacks daykeeper.accounts:read (SCOPE_REQUIRED).
        default:
          $ref: "#/components/responses/Error"
  /v1/usage:
    get:
      operationId: getUsage
      summary: Inspect the current organization's recorded resource usage
      description: |
        Requires organization-wide daykeeper.billing:read. Tenant-bound
        credentials are rejected, including those carrying that scope. There
        is no organization, tenant, period, or policy selector; query parameters
        are rejected. The organization comes only from the verified principal.

        This read reports committed resource-safety counters in the current UTC
        calendar month, pooled across the organization's tenants in one cell.
        It is not a global multi-cell total, billable usage, a delivery count,
        or a resolved-conversation count. All metered message records count,
        including private, activity, human and automated records. Legacy traffic
        without the optional provider boundary is not retroactively metered.

        Unconfigured and paused assignments are successful reads. Null limits
        mean no assignment, not unlimited capacity. Zero is an actual zero
        allowance. Remaining capacity is clamped at zero. A new month does not
        activate traffic or guarantee a retry; writeAdmission is always
        not_evaluated. Installation, identity, routing, and current write-time
        admission are checked elsewhere. This endpoint does not mutate them.
      tags: [Usage]
      security:
        - daykeeperOAuth:
            - daykeeper.billing:read
      responses:
        "200":
          description: One committed snapshot of the authenticated organization's recorded usage.
          headers:
            Cache-Control:
              description: Usage responses, including errors, must not be cached.
              schema:
                type: string
                const: no-store
            X-Request-Id:
              description: Correlation identifier for support.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageStatusResponse"
              examples:
                active:
                  summary: Synthetic provisional policy; not a commercial allowance
                  value:
                    data:
                      organizationId: 10000000-0000-4000-8000-000000000001
                      kind: resource_safety
                      aggregation: organization_single_cell
                      asOf: "2026-08-31T12:00:00.000Z"
                      period:
                        startsAt: "2026-08-01T00:00:00.000Z"
                        endsAt: "2026-09-01T00:00:00.000Z"
                        timezone: UTC
                      state: active
                      assignmentVersion: 1
                      policy:
                        version: synthetic-safety-policy
                        provisional: true
                      resources:
                        contactRecords:
                          {
                            used: 0,
                            limit: 0,
                            remaining: 0,
                            limitReached: true,
                          }
                        conversationRecords:
                          {
                            used: 2,
                            limit: 3,
                            remaining: 1,
                            limitReached: false,
                          }
                        messageRecords:
                          {
                            used: 12,
                            limit: 10,
                            remaining: 0,
                            limitReached: true,
                          }
                      writeAdmission: not_evaluated
                      nextActions:
                        [review_usage_policy, contact_organization_owner]
        "400":
          $ref: "#/components/responses/Error"
          description: Query selectors are not accepted (INVALID_INPUT).
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
          description: Missing billing-read scope (SCOPE_REQUIRED) or tenant-bound credential (ORGANIZATION_ACCESS_REQUIRED). Non-retryable; obtain organization-wide access.
        default:
          $ref: "#/components/responses/Error"
  /v1/agent-credentials:
    get:
      operationId: listAgentCredentials
      summary: List the current organization's agent credentials
      description: |
        Requires a current human organization owner and
        daykeeper.credentials:read. The organization comes only from the
        verified principal; no organization, pagination, or filter selector is
        accepted. Up to 100 bounded metadata records are returned, with all
        active credentials ahead of recent inactive history. `hasMore` reports
        omitted older history. Tokens and token hashes are never returned.

        This list does not create, renew, recover, rotate, or reactivate a
        credential. `expiresAt` is null for a key that lasts until revoked; a
        key that expires within 14 days needs rotating. `replacedById` is set
        on a key that was rotated and is only kept working for its overlap.
      tags: [Agent credentials]
      security:
        - daykeeperOAuth:
            - daykeeper.credentials:read
      responses:
        "200":
          description: Bounded credential metadata for the authenticated organization.
          headers:
            Cache-Control:
              description: Credential metadata must not be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCredentialPageResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
          description: Missing credential-read scope or current human owner authority.
        "503":
          $ref: "#/components/responses/Error"
          description: Agent credential management is not enabled (FEATURE_UNAVAILABLE).
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAgentCredential
      summary: Create a reveal-once agent credential
      description: |
        Requires a current human organization owner and
        daykeeper.credentials:write. The same Idempotency-Key may be submitted
        again only with the exact original body to reconcile an uncertain
        response. A fresh write returns the token exactly once. A successful
        replay returns the original metadata with `token: null`; no secret can
        be recovered. Do not automatically retry this mutation with a new key.

        The server key cannot administer credentials or members and receives only
        explicitly selected scopes held by its owner. An optional tenantId
        restricts it to one tenant in the owner's organization. Lifecycle and
        customer-deletion scopes require this restriction. The tenant may be
        prepared before activation; a key does not enable customer traffic.
        Keys last until revoked unless an explicit expiry is requested.
        Server keys are the recommended authentication for a private backend
        integration; OAuth remains supported.
      tags: [Agent credentials]
      security:
        - daykeeperOAuth:
            - daykeeper.credentials:write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentCredentialInput"
      responses:
        "200":
          description: The exact original request was replayed; the secret is no longer available.
          headers:
            Cache-Control:
              description: Reveal-once results must not be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentCredentialResponse"
        "201":
          description: A credential was created and its secret is revealed exactly once.
          headers:
            Cache-Control:
              description: Reveal-once results must not be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentCredentialResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
          description: Missing credential-write scope or current human owner authority.
        "409":
          $ref: "#/components/responses/Error"
          description: Idempotency input changed or the active credential limit was reached.
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
          description: Agent credential management is not enabled (FEATURE_UNAVAILABLE).
        default:
          $ref: "#/components/responses/Error"
  "/v1/agent-credentials/{agentCredentialId}/revoke":
    parameters:
      - $ref: "#/components/parameters/AgentCredentialId"
    post:
      operationId: revokeAgentCredential
      summary: Revoke an agent credential
      description: |
        Requires a current human organization owner and
        daykeeper.credentials:write. Revocation atomically disables the
        underlying principal grant and is safe to repeat. It also revokes every
        key this one produced by rotating itself. It never creates, replaces,
        recovers, or returns a secret.
      tags: [Agent credentials]
      security:
        - daykeeperOAuth:
            - daykeeper.credentials:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The credential is revoked, including an idempotent replay.
          headers:
            Cache-Control:
              description: Credential mutation results must not be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeAgentCredentialResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
          description: Missing credential-write scope or current human owner authority.
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
          description: Agent credential management is not enabled (FEATURE_UNAVAILABLE).
        default:
          $ref: "#/components/responses/Error"
  "/v1/agent-credentials/{agentCredentialId}/rotate":
    parameters:
      - $ref: "#/components/parameters/AgentCredentialId"
    post:
      operationId: rotateAgentCredential
      summary: Replace an agent credential's secret
      description: |
        Issues a new server key with the same name, scopes and tenant
        restriction, and returns its token exactly once. Either a current human
        organization owner holding daykeeper.credentials:write and every scope
        the key carries, or the server key itself (authenticated with the key
        being rotated) may call it. A server key can rotate only itself.

        The previous key keeps working for `overlapHours` (default 24, at most
        168) so a deployment can switch to the new secret without an outage,
        and never longer than its own expiry. `overlapHours: 0` revokes it at
        once.

        A server key rotating itself must not send `overlapHours: 0`. It
        revokes the key making the call, so if the response is lost the agent
        can neither authenticate a replay nor use the recovery below, and only
        an owner can issue it a new key. Deployed servers accept it today; a
        server may reject it with INVALID_INPUT (400). An owner may still use
        0 to cut a key off at once.

        Lifetime: `validityDays` omitted keeps the rotated key's policy (a key
        that never expires, or one issued before agent credentials stopped
        expiring by default, gets a key that lasts until revoked; otherwise the
        same lifetime again); `null` lasts until revoked; a number is days. A
        server key rotating itself never gets a later expiry than it already
        had, whatever it asks for.

        Revoking a key also revokes every key it produced by rotating itself.
        Rotations are limited per organization (with the same 25 unexpired-key
        ceiling as creation, counting keys still in an overlap), and a chain of
        keys rotating themselves may rotate at most 5 times a day.

        An owner rotates a key once: rotating a revoked or already replaced key
        answers RESOURCE_STATE_CONFLICT. The same Idempotency-Key may be
        submitted again only with the exact original body; a replay returns the
        original metadata with `token: null` and the secret cannot be
        recovered. A server key that rotated itself and lost the response may,
        while it still works, call rotate again with a new Idempotency-Key: the
        successor it never used is revoked and a fresh one is issued. A
        successor that has already been used is never replaced this way.

        Responses to a server-key request carry
        `Daykeeper-Credential-Expires-At` when that key expires within 14
        days, so an agent can rotate before it stops working.
      tags: [Agent credentials]
      security:
        - daykeeperOAuth:
            - daykeeper.credentials:write
        - daykeeperServerKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateAgentCredentialInput"
      responses:
        "200":
          description: The exact original request was replayed; the new secret is no longer available.
          headers:
            Cache-Control:
              description: Reveal-once results must not be cached.
              schema:
                type: string
                const: no-store
            Daykeeper-Credential-Expires-At:
              $ref: "#/components/headers/DaykeeperCredentialExpiresAt"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateAgentCredentialResponse"
        "201":
          description: A replacement credential was created and its secret is revealed exactly once.
          headers:
            Cache-Control:
              description: Reveal-once results must not be cached.
              schema:
                type: string
                const: no-store
            Daykeeper-Credential-Expires-At:
              $ref: "#/components/headers/DaykeeperCredentialExpiresAt"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateAgentCredentialResponse"
        "400":
          $ref: "#/components/responses/Error"
          description: Invalid input or a missing Idempotency-Key (INVALID_INPUT).
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
          description: Not an owner holding the key's scopes, or a server key rotating a different key (ORGANIZATION_ACCESS_REQUIRED).
        "404":
          $ref: "#/components/responses/Error"
          description: No such credential in the caller's organization (RESOURCE_NOT_FOUND).
        "409":
          $ref: "#/components/responses/Error"
          description: The key is revoked or already rotated (RESOURCE_STATE_CONFLICT), the Idempotency-Key was reused for different input (IDEMPOTENCY_KEY_REUSED), or the active credential limit was reached (CREDENTIAL_LIMIT_REACHED).
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
          description: Agent credential management is not enabled (FEATURE_UNAVAILABLE).
        default:
          $ref: "#/components/responses/Error"
  /v1/tenant-plans:
    post:
      operationId: planTenant
      summary: Plan creation of a tenant
      description: |
        Optional website settings prepare the first website inbox in this same
        tenant operation. Inspect websiteInboxes in capabilities first; disabled
        provisioning rejects website settings with FEATURE_UNAVAILABLE. Omitting
        website preserves account-only behavior. Plans with website settings
        explain that preparation does not enable traffic. Existing entitlement,
        idempotency and plan-expiry rules still apply. No provider identifier or
        credential is returned, and preparation is not a successful client test.
      tags: [Tenants]
      security:
        - daykeeperOAuth:
            - daykeeper.accounts:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSpec"
      responses:
        "201":
          description: A short-lived, inspectable tenant creation plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPlanResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/tenants:apply":
    post:
      operationId: applyTenantPlan
      summary: Apply a tenant creation plan
      description: |
        Returns the original result when the same idempotency key is replayed.
        New tenant admission requires an active organization entitlement with
        available tenant capacity. Planning alone reserves no capacity; apply
        checks admission atomically. Every persisted tenant state counts,
        including degraded, suspended, and deleting tenants. Failed provider
        work does not free its reservation. Accepted apply replays bypass a
        new entitlement decision; existing plan-expiry rules still apply.
      tags: [Tenants]
      security:
        - daykeeperOAuth:
            - daykeeper.provisioning:apply
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyPlanInput"
      responses:
        "200":
          description: An idempotent replay of the original apply result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyTenantResponse"
        "202":
          description: Provisioning was accepted as a durable operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyTenantResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          description: |
            The caller lacks the required scope, or the organization has no
            assigned entitlement (ENTITLEMENT_REQUIRED) or a revoked assignment
            (ENTITLEMENT_INACTIVE). Entitlement denials are not retryable until
            the organization's assignment changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                entitlementRequired:
                  value:
                    error:
                      code: ENTITLEMENT_REQUIRED
                      message: The organization needs an assigned entitlement before provisioning
                      retryable: false
                      nextActions:
                        - inspect_entitlements
                        - contact_organization_owner
                      correlationId: 10000000-0000-4000-8000-000000000002
                entitlementInactive:
                  value:
                    error:
                      code: ENTITLEMENT_INACTIVE
                      message: The organization entitlement is not active for provisioning
                      retryable: false
                      nextActions:
                        - inspect_entitlements
                        - contact_organization_owner
                      correlationId: 10000000-0000-4000-8000-000000000002
        "409":
          description: |
            A provisioning conflict, including an exhausted tenant allowance
            (TENANT_QUOTA_EXCEEDED). Quota denials are not retryable without a
            capacity or assignment change; existing conflict codes still apply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                tenantQuotaExceeded:
                  value:
                    error:
                      code: TENANT_QUOTA_EXCEEDED
                      message: The organization has reached its tenant provisioning allowance
                      retryable: false
                      nextActions:
                        - inspect_entitlements
                        - contact_organization_owner
                      correlationId: 10000000-0000-4000-8000-000000000002
        default:
          $ref: "#/components/responses/Error"
  /v1/tenants:
    get:
      operationId: listTenants
      summary: List tenants visible to the caller
      tags: [Tenants]
      security:
        - daykeeperOAuth:
            - daykeeper.accounts:read
      responses:
        "200":
          description: Tenant list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/tenants/{tenantId}":
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: getTenant
      summary: Get a tenant
      tags: [Tenants]
      security:
        - daykeeperOAuth:
            - daykeeper.accounts:read
      responses:
        "200":
          description: Tenant state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/tenants/{tenantId}/customer-sessions":
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      operationId: createCustomerSession
      summary: Create a short-lived tenant gateway token
      description: |

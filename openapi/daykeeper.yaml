          format: uuid
        organizationSlug:
          type: string
        credentialIssued:
          type: boolean
        credential:
          type: object
          additionalProperties: false
          required: [id, expiresAt, revokedAt, policyVersion]
          properties:
            id:
              type: string
              format: uuid
            expiresAt:
              type: string
              format: date-time
            revokedAt:
              type: [string, "null"]
              format: date-time
            policyVersion:
              type: string
              const: machine-onboarding-v1
        replayed:
          type: boolean
        token:
          type: [string, "null"]
          pattern: "^dk_machine_[0-9a-f]{32}_[A-Za-z0-9_-]{43}$"
    MachineRotationInput:
      type: object
      additionalProperties: false
      required: [ownerId, expectedCredentialId, intentId]
      properties:
        ownerId:
          type: string
          format: uuid
        expectedCredentialId:
          type: string
          format: uuid
        intentId:
          type: string
          format: uuid
    MachineRotationResult:
      type: object
      additionalProperties: false
      required:
        [
          ownerId,
          organizationId,
          credentialId,
          predecessorId,
          intentId,
          expiresAt,
          revokedAt,
          replayed,
          token,
        ]
      properties:
        ownerId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        credentialId:
          type: string
          format: uuid
        predecessorId:
          type: string
          format: uuid
        intentId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        replayed:
          type: boolean
        token:
          type: [string, "null"]
          pattern: "^dk_machine_[0-9a-f]{32}_[A-Za-z0-9_-]{43}$"
    MachineCredentialMetadata:
      type: object
      additionalProperties: false
      required: [ownerId, organizationId, credentialId, expiresAt, revokedAt]
      properties:
        ownerId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        credentialId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
    AgentCredentialScope:
      type: string
      description: A scope that a human owner may delegate to a server key.
      enum:
        - daykeeper.accounts:read
        - daykeeper.accounts:write
        - daykeeper.flows:read
        - daykeeper.flows:write
        - daykeeper.flows:publish
        - daykeeper.flows:operate
        - daykeeper.provisioning:read
        - daykeeper.provisioning:apply
        - daykeeper.billing:read
        - daykeeper.customer-sessions:write
        - daykeeper.conversations:read
        - daykeeper.conversations:write
        - daykeeper.lifecycle:write
        - daykeeper.customers:delete
    AgentCredential:
      type: object
      additionalProperties: true
      description: Credential metadata. Open to fields added in later minor versions, but never carries a secret.
      required:
        [
          id,
          organizationId,
          name,
          hint,
          scopes,
          state,
          expiresAt,
          lastUsedAt,
          revokedAt,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
          description: Organization derived from the authenticated owner.
        tenantId:
          type: [string, "null"]
          format: uuid
          description: Null for an organization-wide key; otherwise restricts this key to this tenant. Lifecycle and customer-deletion scopes require a tenant binding. Current servers always send it; servers before tenant-scoped keys omit it, which means organization-wide.
        name:
          type: string
          minLength: 2
          maxLength: 80
        hint:
          type: string
          pattern: "^dk_agent_[0-9a-f]{8}…[A-Za-z0-9_-]{4}$"
          description: Bounded display hint; never usable as a bearer credential.
        scopes:
          type: array
          minItems: 1
          maxItems: 14
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AgentCredentialScope"
        state:
          type: string
          enum: [active, expired, revoked]
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: Null when the credential lasts until it is revoked.
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        rotatedFromId:
          type: [string, "null"]
          format: uuid
          description: Optional on older servers. The credential this one replaced, when it was issued by rotation.
        replacedById:
          type: [string, "null"]
          format: uuid
          description: Optional on older servers. The credential that replaced this one. A replaced key keeps working only until its `expiresAt`, the end of the rotation overlap.
        replacedAt:
          type: [string, "null"]
          format: date-time
          description: Optional on older servers. When this credential was rotated.
        token: false
        tokenHash: false
    AgentCredentialPage:
      type: object
      additionalProperties: true
      required: [items, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AgentCredential"
        hasMore:
          type: boolean
          description: True when older inactive history was omitted.
    CreateAgentCredentialInput:
      type: object
      additionalProperties: false
      required: [name, scopes]
      allOf:
        - if:
            additionalProperties: true
            properties:
              scopes:
                contains:
                  enum: [daykeeper.lifecycle:write, daykeeper.customers:delete]
            required: [scopes]
          then:
            additionalProperties: true
            properties:
              tenantId: { type: string, format: uuid }
            required: [tenantId]
        - if:
            additionalProperties: true
            properties:
              tenantId: { type: string, format: uuid }
            required: [tenantId]
          then:
            additionalProperties: true
            properties:
              scopes:
                items:
                  enum:
                    [
                      daykeeper.customer-sessions:write,
                      daykeeper.lifecycle:write,
                      daykeeper.customers:delete,
                    ]
      properties:
        tenantId:
          type: string
          format: uuid
          description: When present, restricts this key to this tenant within its organization. Lifecycle and customer-deletion scopes require tenantId.
        name:
          type: string
          minLength: 2
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          maxItems: 14
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AgentCredentialScope"
        validityDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
          default: null
          description: Days until the credential expires. Omitted or null, the default, issues a credential that lasts until it is revoked.
    CreateAgentCredentialResult:
      type: object
      additionalProperties: true
      description: A fresh result has a token and replayed false; a replay has token null and replayed true.
      required: [credential, token, replayed]
      properties:
        credential:
          $ref: "#/components/schemas/AgentCredential"
        token:
          type: [string, "null"]
          pattern: "^dk_agent_[0-9a-f]{32}_[A-Za-z0-9_-]{43}$"
          description: Sensitive bearer token revealed only on the original successful response. Never log or persist it outside a secret manager.
        replayed:
          type: boolean
    RevokeAgentCredentialResult:
      type: object
      additionalProperties: true
      required: [credential, replayed]
      properties:
        credential:
          $ref: "#/components/schemas/AgentCredential"
        replayed:
          type: boolean
    RotateAgentCredentialInput:
      type: object
      additionalProperties: false
      properties:
        overlapHours:
          type: integer
          minimum: 0
          maximum: 168
          default: 24
          description: Hours the previous key keeps working, never beyond its own expiry. 0 revokes it at once. A server key rotating itself must send at least 1, because 0 leaves it no way to recover a lost response; a server may reject 0 from a server key with INVALID_INPUT.
        validityDays:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
          description: Days until the new credential expires; null lasts until it is revoked. Omitted keeps the rotated key's policy. A server key rotating itself is capped at its own current expiry.
    RotateAgentCredentialResult:
      type: object
      additionalProperties: true
      description: A fresh result has a token and replayed false; a replay has token null and replayed true.
      required: [credential, previousCredential, token, replayed]
      properties:
        credential:
          $ref: "#/components/schemas/AgentCredential"
        previousCredential:
          $ref: "#/components/schemas/AgentCredential"
        token:
          type: [string, "null"]
          pattern: "^dk_agent_[0-9a-f]{32}_[A-Za-z0-9_-]{43}$"
          description: Sensitive bearer token for the new credential, revealed only on the original successful response. Never log or persist it outside a secret manager.
        replayed:
          type: boolean
    WorkspaceClaim:
      type: object
      additionalProperties: false
      description: |
        An owner invitation issued by a machine owner. It reuses the existing
        invitation lifecycle: single use, email-match on acceptance, and a
        bounded expiry. Accepting it never demotes the machine owner.
      required:
        [
          id,
          organizationId,
          email,
          role,
          state,
          expiresAt,
          createdAt,
          acceptedAt,
          revokedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
          description: Organization derived from the authenticated machine owner.
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Lowercased address that must sign in to accept this claim.
        role:
          type: string
          const: owner
        state:
          type: string
          enum: [pending, accepted, revoked]
          description: |
            Expiry is not a state. A pending claim past its expiry is hidden
            from the list rather than reported; accepted and revoked claims stay
            listed.
        expiresAt:
          type: string
          format: date-time
          maxLength: 64
        createdAt:
          type: string
          format: date-time
          maxLength: 64
        acceptedAt:
          type: [string, "null"]
          format: date-time
          maxLength: 64
          description: |
            When the invited person signed in and took ownership, or null while
            the claim is pending or revoked. Always present, never omitted.
        revokedAt:
          type: [string, "null"]
          format: date-time
          maxLength: 64
          description: |
            When the claim was revoked, either by the machine owner or by
            expiry sweeping a stale pending row, or null otherwise. Always
            present, never omitted.
    CreateWorkspaceClaimInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          pattern: "^[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*@[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$"
          description: |
            Lowercased address that must accept the claim. The local part is one
            or more dot-separated atoms, so a leading, trailing, or doubled dot
            is rejected; the domain is one or more labels of at most 63
            characters that neither start nor end with a hyphen, separated by
            dots, and at least one dot is required. Uppercase is rejected rather
            than folded so the stored address matches the one that signs in.
            The caller delivers the returned claim URL; an installation may also
            email it to this address (see `emailed` on the result).
          examples:
            - gabriel@acme.com
            - gabriel+claims@mail.acme.co.uk
    WorkspaceClaimCreated:
      type: object
      additionalProperties: false
      description: |
        The result of a fresh application: the claim, its single-use token, and
        the console claim URL, revealed exactly once. This is the 201 body.
      required: [claim, token, claimUrl, replayed]
      properties:
        claim:
          $ref: "#/components/schemas/WorkspaceClaim"
        token:
          type: string
          minLength: 1
          maxLength: 512
          pattern: "^dk_invite_[A-Za-z0-9_-]+$"
          description: Sensitive single-use invitation token revealed only on the original successful response. Never log or persist it outside a secret manager.
        claimUrl:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: "^https://[^\\s#]+#token=dk_invite_[A-Za-z0-9_-]+$"
          description: |
            Sensitive one-time handoff URL built from the console origin. The
            token is carried in the fragment so it never reaches server logs or
            referrers. Revealed only on the original successful response.
        replayed:
          type: boolean
          const: false
        emailed:
          type: boolean
          description: |
            Whether this request emailed the claim URL to the claimed address.
            Present only on an installation that emails claim links, and then
            `false` when the send did not succeed (a failed send never fails
            the claim). An installation that does not email claims, which is
            the default, omits the field, so its responses keep the 1.7 shape
            that this schema's `additionalProperties: false` accepted.
            Operators must move clients to 1.8.0 before turning claim emails
            on. The email carries the link and its expiry and no text the
            agent chose.
    WorkspaceClaimReplayed:
      type: object
      additionalProperties: false
      description: |
        The result of an exact repeat under the same idempotency key: the
        pending claim without its secret. This is the 200 body. Revoke the claim
        and create a new one to reissue a lost URL.
      required: [claim, token, claimUrl, replayed]
      properties:
        claim:
          $ref: "#/components/schemas/WorkspaceClaim"
        token:
          type: "null"
          description: Always null on a replay; the token was revealed only on the original response and cannot be recovered.
        claimUrl:
          type: "null"
          description: Always null on a replay; the claim URL was revealed only on the original response and cannot be recovered.
        replayed:
          type: boolean
          const: true
        emailed:
          type: boolean
          const: false
          description: |
            Present only on an installation that emails claim links, and then
            always `false`: a replay sends no email, and whether the original
            request emailed the link is not repeated. Omitted elsewhere, as on
            the created result.
    WorkspaceClaimResult:
      description: |
        Either result of a create call, discriminated by `replayed`: a fresh
        result carries a string token and claim URL with `replayed` false, and a
        replay carries both fields null with `replayed` true. Responses are
        status-specific — 201 is always the fresh shape and 200 always the
        replay — so a client that already knows the status can narrow to one
        member without inspecting `replayed`.
      oneOf:
        - $ref: "#/components/schemas/WorkspaceClaimCreated"
        - $ref: "#/components/schemas/WorkspaceClaimReplayed"
    WorkspaceClaimList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: |
            Every pending, accepted and revoked claim for the organization,
            expired claims hidden, ordered newest first. The list is not
            paginated in v1 and accepts no cursor, page, or filter selector;
            the hourly issue limit bounds how many claims an organization can
            accumulate.
          items:
            $ref: "#/components/schemas/WorkspaceClaim"
    DaykeeperScope:
      type: string
      enum:
        - daykeeper.accounts:read
        - daykeeper.accounts:write
        - daykeeper.billing:read
        - daykeeper.credentials:read
        - daykeeper.credentials:write
        - daykeeper.flows:read
        - daykeeper.flows:write
        - daykeeper.flows:publish
        - daykeeper.provisioning:read
        - daykeeper.provisioning:apply
        - daykeeper.customer-sessions:write
        - daykeeper.lifecycle:write
        - daykeeper.customers:delete
        - daykeeper.conversations:read
        - daykeeper.conversations:write
    ErrorDetail:
      type: object
      # Response envelope: open so older clients tolerate new fields.
      additionalProperties: true
      required: [code, message, retryable, nextActions, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        nextActions:
          type: array
          items:
            type: string
        correlationId:
          type: string
        outcomeUnknown:
          type: boolean
          description: |
            Optional marker for a dispatched mutation whose response was lost
            or unavailable. When true, inspect the affected resource before
            deciding whether to repeat the same request; clients must not
            automatically retry the write.
        fields:
          type: array
          items:
            type: string

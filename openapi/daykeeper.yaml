        publicKey:
          $ref: "#/components/schemas/MachinePublicKey"
    MachineChallenge:
      type: object
      additionalProperties: false
      required:
        [
          challengeId,
          audience,
          nonce,
          keyThumbprint,
          requestHash,
          createdAt,
          expiresAt,
        ]
      properties:
        challengeId:
          type: string
          format: uuid
        audience:
          type: string
          format: uri
        nonce:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        keyThumbprint:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        requestHash:
          type: string
          minLength: 64
          maxLength: 64
          pattern: "^[0-9a-f]{64}$"
        createdAt:
          type: integer
          minimum: 0
        expiresAt:
          type: integer
          minimum: 0
    MachineProofInput:
      type: object
      additionalProperties: false
      required: [challengeId, proof]
      properties:
        challengeId:
          type: string
          format: uuid
        proof:
          type: string
          minLength: 1
          maxLength: 4096
    MachineEnrollmentResult:
      type: object
      additionalProperties: false

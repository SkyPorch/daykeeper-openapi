        organizationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        state:
          type: string
          enum: [draft, published, archived]
        latestVersion:
          type: integer
          minimum: 1
        publishedVersion:
          type: integer
          minimum: 1
        resourceVersion:

openapi: 3.1.0
info:
  title: Daykeeper Management API
  version: 0.2.0
  summary: Safe, multi-tenant support administration for people and agents.
  description: |
    Daykeeper owns tenant lifecycle, support-channel provisioning, durable
    operations, and versioned flows. Mutations that create external resources
    use plan/apply and idempotency. Infrastructure-provider credentials and
    identifiers are never part of this contract.
  contact:
    name: SkyPorch
    url: https://github.com/SkyPorch/daykeeper-openapi
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: https://api.daykeeper.example
    description: Placeholder origin; SDK consumers configure their deployed Daykeeper origin.
tags:
  - name: Capabilities
    description: Runtime feature and schema discovery.
  - name: Entitlements
    description: Current-organization admission policy and enforced-resource discovery.
  - name: Usage
    description: Organization-wide recorded resource-safety counters, not billing or traffic admission.
  - name: Agent credentials
    description: Reveal-once, owner-managed credentials for headless workloads that cannot use hosted OAuth.
  - name: Tenants
    description: Tenant planning, provisioning, and observed state.
  - name: Customer sessions
    description: Short-lived customer and service tokens for a tenant gateway.
  - name: Email channels
    description: Email-domain planning, DNS evidence, and round-trip readiness.
  - name: Website channels
    description: First-inbox preparation and observed installation readiness.
  - name: Domain verification
    description: DNS observation and durable domain-proof evidence; never traffic activation.
  - name: Operations
    description: Durable, inspectable provisioning work.
  - name: Flows
    description: Versioned, immutable support-flow management.
security:
  - daykeeperOAuth:
      - daykeeper.accounts:read
paths:
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Inspect enabled API capabilities
      tags: [Capabilities]
      security:
        - daykeeperOAuth:
            - daykeeper.accounts:read
      responses:
        "200":
          description: Enabled capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/entitlements:
    get:
      operationId: getEntitlements
      summary: Inspect the current organization's entitlements
      description: |
        Requires a verified Daykeeper access token with daykeeper.accounts:read.
        The organization comes only from the authenticated principal; there is
        no organization selector. A tenant-bound principal with this scope also
        receives organization-wide tenant occupancy, not a tenant-local count.

        Unconfigured, revoked, and exhausted assignments are successful status
        reads, not HTTP policy errors. This read neither assigns an entitlement
        nor reserves capacity. The one-tenant free-2026-08-31 policy is a
        provisional provisioning safeguard, not approved marketing pricing or
        general free-tier activation. The legacy metering fields describe this
        admission-only contract, not optional provider enforcement. Use /v1/usage
        for recorded resource counters; neither read proves traffic readiness.
      tags: [Entitlements]
      security:
        - daykeeperOAuth:
            - daykeeper.accounts:read
      responses:
        "200":
          description: The authenticated organization's current admission status.
          headers:
            Cache-Control:
              description: Entitlement status must not be cached.
              schema:
                type: string
                const: no-store
            X-Request-Id:
              description: Correlation identifier shared with support and audit logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementStatusResponse"
              examples:
                available:
                  summary: Provisional policy with capacity for one new tenant
                  value:
                    data:
                      organizationId: 10000000-0000-4000-8000-000000000001
                      state: active
                      assignmentVersion: 1
                      policy:
                        version: free-2026-08-31
                        plan: free
                        provisional: true
                        tenantLimit: 1
                      tenantProvisioning:
                        enforced: true
                        allowed: true
                        used: 0
                        limit: 1
                        remaining: 1
                        denial: null
                      metering:
                        conversations: not_enforced
                        storage: not_enforced
                unconfigured:
                  summary: No assignment; reading status does not activate a plan
                  value:
                    data:
                      organizationId: 10000000-0000-4000-8000-000000000001
                      state: unconfigured
                      assignmentVersion: null
                      policy: null
                      tenantProvisioning:
                        enforced: true
                        allowed: false
                        used: 0
                        limit: null
                        remaining: null
                        denial:
                          code: ENTITLEMENT_REQUIRED
                          retryable: false
                          nextActions:
                            - inspect_entitlements
                            - contact_organization_owner
                      metering:
                        conversations: not_enforced
                        storage: not_enforced
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
          description: The access token lacks daykeeper.accounts:read (SCOPE_REQUIRED).
        default:
          $ref: "#/components/responses/Error"
  /v1/usage:
    get:
      operationId: getUsage
      summary: Inspect the current organization's recorded resource usage
      description: |
        Requires organization-wide daykeeper.billing:read. Tenant-bound
        credentials are rejected, including those carrying that scope. There
        is no organization, tenant, period, or policy selector; query parameters
        are rejected. The organization comes only from the verified principal.

        This read reports committed resource-safety counters in the current UTC
        calendar month, pooled across the organization's tenants in one cell.
        It is not a global multi-cell total, billable usage, a delivery count,
        or a resolved-conversation count. All metered message records count,
        including private, activity, human and automated records. Legacy traffic
        without the optional provider boundary is not retroactively metered.

        Unconfigured and paused assignments are successful reads. Null limits
        mean no assignment, not unlimited capacity. Zero is an actual zero
        allowance. Remaining capacity is clamped at zero. A new month does not
        activate traffic or guarantee a retry; writeAdmission is always
        not_evaluated. Installation, identity, routing, and current write-time
        admission are checked elsewhere. This endpoint does not mutate them.
      tags: [Usage]
      security:
        - daykeeperOAuth:
            - daykeeper.billing:read
      responses:
        "200":
          description: One committed snapshot of the authenticated organization's recorded usage.
          headers:
            Cache-Control:
              description: Usage responses, including errors, must not be cached.
              schema:
                type: string
                const: no-store
            X-Request-Id:
              description: Correlation identifier for support.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageStatusResponse"
              examples:
                active:
                  summary: Synthetic provisional policy; not a commercial allowance
                  value:
                    data:
                      organizationId: 10000000-0000-4000-8000-000000000001
                      kind: resource_safety
                      aggregation: organization_single_cell
                      asOf: "2026-08-31T12:00:00.000Z"
                      period:
                        startsAt: "2026-08-01T00:00:00.000Z"
                        endsAt: "2026-09-01T00:00:00.000Z"
                        timezone: UTC
                      state: active
                      assignmentVersion: 1
                      policy:
                        version: synthetic-safety-policy
                        provisional: true
                      resources:
                        contactRecords:
                          {
                            used: 0,
                            limit: 0,
                            remaining: 0,
                            limitReached: true,
                          }
                        conversationRecords:
                          {
                            used: 2,
                            limit: 3,
                            remaining: 1,
                            limitReached: false,
                          }
                        messageRecords:
                          {
                            used: 12,
                            limit: 10,
                            remaining: 0,
                            limitReached: true,
                          }
                      writeAdmission: not_evaluated
                      nextActions:
                        [review_usage_policy, contact_organization_owner]
        "400":
          $ref: "#/components/responses/Error"
          description: Query selectors are not accepted (INVALID_INPUT).
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
          description: Missing billing-read scope (SCOPE_REQUIRED) or tenant-bound credential (ORGANIZATION_ACCESS_REQUIRED). Non-retryable; obtain organization-wide access.
        default:
          $ref: "#/components/responses/Error"
  /v1/agent-credentials:
    get:
      operationId: listAgentCredentials
      summary: List the current organization's agent credentials
      description: |
        Requires a current human organization owner and
        daykeeper.credentials:read. The organization comes only from the
        verified principal; no organization, pagination, or filter selector is
        accepted. Up to 100 bounded metadata records are returned, with all
        active credentials ahead of recent inactive history. `hasMore` reports
        omitted older history. Tokens and token hashes are never returned.

        Hosted OAuth remains the preferred workload identity. This list does
        not create, renew, recover, rotate, or reactivate a credential.
      tags: [Agent credentials]
      security:
        - daykeeperOAuth:
            - daykeeper.credentials:read
      responses:
        "200":
          description: Bounded credential metadata for the authenticated organization.
          headers:
            Cache-Control:
              description: Credential metadata must not be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCredentialPageResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
          description: Missing credential-read scope or current human owner authority.
        "503":
          $ref: "#/components/responses/Error"
          description: Agent credential management is not enabled (FEATURE_UNAVAILABLE).
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAgentCredential
      summary: Create a reveal-once agent credential
      description: |
        Requires a current human organization owner and
        daykeeper.credentials:write. The same Idempotency-Key may be submitted
        again only with the exact original body to reconcile an uncertain
        response. A fresh write returns the token exactly once. A successful
        replay returns the original metadata with `token: null`; no secret can
        be recovered. Do not automatically retry this mutation with a new key.

        The credential expires, cannot administer credentials or members, and
        can receive only the explicitly selected delegable scopes. Hosted OAuth
        remains the preferred workload identity.
      tags: [Agent credentials]
      security:
        - daykeeperOAuth:
            - daykeeper.credentials:write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentCredentialInput"
      responses:
        "200":
          description: The exact original request was replayed; the secret is no longer available.
          headers:
            Cache-Control:
              description: Reveal-once results must not be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentCredentialResponse"
        "201":
          description: A credential was created and its secret is revealed exactly once.
          headers:
            Cache-Control:
              description: Reveal-once results must not be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentCredentialResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
          description: Missing credential-write scope or current human owner authority.
        "409":
          $ref: "#/components/responses/Error"
          description: Idempotency input changed or the active credential limit was reached.
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
          description: Agent credential management is not enabled (FEATURE_UNAVAILABLE).
        default:
          $ref: "#/components/responses/Error"
  "/v1/agent-credentials/{agentCredentialId}/revoke":
    parameters:
      - $ref: "#/components/parameters/AgentCredentialId"
    post:
      operationId: revokeAgentCredential
      summary: Revoke an agent credential
      description: |
        Requires a current human organization owner and
        daykeeper.credentials:write. Revocation atomically disables the
        underlying principal grant and is safe to repeat. It never creates,
        replaces, recovers, or returns a secret.
      tags: [Agent credentials]
      security:
        - daykeeperOAuth:
            - daykeeper.credentials:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The credential is revoked, including an idempotent replay.
          headers:
            Cache-Control:
              description: Credential mutation results must not be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeAgentCredentialResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
          description: Missing credential-write scope or current human owner authority.
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
          description: Agent credential management is not enabled (FEATURE_UNAVAILABLE).
        default:
          $ref: "#/components/responses/Error"
  /v1/tenant-plans:
    post:
      operationId: planTenant
      summary: Plan creation of a tenant
      description: |
        Optional website settings prepare the first website inbox in this same
        tenant operation. Inspect websiteInboxes in capabilities first; disabled
        provisioning rejects website settings with FEATURE_UNAVAILABLE. Omitting
        website preserves account-only behavior. Plans with website settings
        explain that preparation does not enable traffic. Existing entitlement,
        idempotency and plan-expiry rules still apply. No provider identifier or
        credential is returned, and preparation is not a successful client test.
      tags: [Tenants]
      security:
        - daykeeperOAuth:
            - daykeeper.accounts:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSpec"
      responses:
        "201":
          description: A short-lived, inspectable tenant creation plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPlanResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/tenants:apply":
    post:
      operationId: applyTenantPlan
      summary: Apply a tenant creation plan
      description: |
        Returns the original result when the same idempotency key is replayed.
        New tenant admission requires an active organization entitlement with
        available tenant capacity. Planning alone reserves no capacity; apply
        checks admission atomically. Every persisted tenant state counts,
        including degraded, suspended, and deleting tenants. Failed provider
        work does not free its reservation. Accepted apply replays bypass a
        new entitlement decision; existing plan-expiry rules still apply.
      tags: [Tenants]
      security:
        - daykeeperOAuth:
            - daykeeper.provisioning:apply
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyPlanInput"
      responses:
        "200":
          description: An idempotent replay of the original apply result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyTenantResponse"
        "202":
          description: Provisioning was accepted as a durable operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyTenantResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          description: |
            The caller lacks the required scope, or the organization has no
            assigned entitlement (ENTITLEMENT_REQUIRED) or a revoked assignment
            (ENTITLEMENT_INACTIVE). Entitlement denials are not retryable until
            the organization's assignment changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                entitlementRequired:
                  value:
                    error:
                      code: ENTITLEMENT_REQUIRED
                      message: The organization needs an assigned entitlement before provisioning
                      retryable: false
                      nextActions:
                        - inspect_entitlements
                        - contact_organization_owner
                      correlationId: 10000000-0000-4000-8000-000000000002
                entitlementInactive:
                  value:
                    error:
                      code: ENTITLEMENT_INACTIVE
                      message: The organization entitlement is not active for provisioning
                      retryable: false
                      nextActions:
                        - inspect_entitlements
                        - contact_organization_owner
                      correlationId: 10000000-0000-4000-8000-000000000002
        "409":
          description: |
            A provisioning conflict, including an exhausted tenant allowance
            (TENANT_QUOTA_EXCEEDED). Quota denials are not retryable without a
            capacity or assignment change; existing conflict codes still apply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                tenantQuotaExceeded:
                  value:
                    error:
                      code: TENANT_QUOTA_EXCEEDED
                      message: The organization has reached its tenant provisioning allowance
                      retryable: false
                      nextActions:
                        - inspect_entitlements
                        - contact_organization_owner
                      correlationId: 10000000-0000-4000-8000-000000000002
        default:
          $ref: "#/components/responses/Error"
  /v1/tenants:
    get:
      operationId: listTenants
      summary: List tenants visible to the caller
      tags: [Tenants]
      security:
        - daykeeperOAuth:
            - daykeeper.accounts:read
      responses:
        "200":
          description: Tenant list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/tenants/{tenantId}":
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: getTenant
      summary: Get a tenant
      tags: [Tenants]
      security:
        - daykeeperOAuth:
            - daykeeper.accounts:read
      responses:
        "200":
          description: Tenant state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/tenants/{tenantId}/customer-sessions":
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      operationId: createCustomerSession
      summary: Create a short-lived tenant gateway token
      description: |
        Exchanges the caller's tenant-bound service identity for a token that
        can be used only at the customer gateway. Customer context selects
        support presentation and never grants product entitlement. Lifecycle
        and erasure purposes require their own OAuth scopes.
      tags: [Customer sessions]
      security:
        - daykeeperOAuth:
            - daykeeper.customer-sessions:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerSessionInput"
      responses:
        "201":
          description: A short-lived, audience-bound gateway token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/tenants/{tenantId}/email-channel-plans":
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      operationId: planEmailChannel
      summary: Plan an email channel
      tags: [Email channels]
      security:
        - daykeeperOAuth:
            - daykeeper.accounts:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChannelSpec"
      responses:
        "201":
          description: A short-lived email-channel plan and required DNS records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChannelPlanResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/email-channels:apply":
    post:
      operationId: applyEmailChannelPlan
      summary: Apply an email-channel plan
      tags: [Email channels]
      security:
        - daykeeperOAuth:
            - daykeeper.provisioning:apply
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyPlanInput"
      responses:
        "200":
          description: An idempotent replay of the original apply result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyEmailChannelResponse"
        "202":
          description: Channel provisioning was accepted as a durable operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyEmailChannelResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/tenants/{tenantId}/email-channel":
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: getEmailChannel
      summary: Get a tenant email channel
      tags: [Email channels]
      security:
        - daykeeperOAuth:
            - daykeeper.provisioning:read
      responses:
        "200":
          description: Email-channel state and readiness evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChannelResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/tenants/{tenantId}/website-channel":
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: getWebsiteChannel
      summary: Inspect the tenant's first website inbox
      description: |
        A non-cacheable status read, available after an accepted tenant plan
        containing website settings. Prepared does not mean customer traffic is
        enabled: routing, identity checks, usage enforcement and installation
        verification must all pass before activation. This read never activates
        a channel, returns provider credentials, or creates another inbox.
      tags: [Website channels]
      security:
        - daykeeperOAuth: [daykeeper.accounts:read]
      responses:
        "200":
          description: Public website-channel metadata without provider secrets.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteChannelResponse"
              examples:
                prepared:
                  value:
                    data:
                      id: "30000000-0000-4000-8000-000000000001"
                      organizationId: "10000000-0000-4000-8000-000000000001"
                      tenantId: "20000000-0000-4000-8000-000000000001"
                      spec:
                        websiteUrl: https://example.test/
                        allowedOrigins: [https://example.test]
                      state: prepared
                      trafficEnabled: false
                      version: 2
                      createdAt: "2026-08-31T00:00:00.000Z"
                      updatedAt: "2026-08-31T00:01:00.000Z"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/tenants/{tenantId}/domain-verifications":
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      operationId: createDomainVerification
      summary: Create or replay a tenant domain verification
      description: |
        Persists a DNS TXT observation challenge for the exact HTTPS origin.
        This is durable verification evidence only; it never enables customer
        traffic. Exact retries with the same Idempotency-Key return the
        original challenge and DNS value without generating a new nonce.
        Machine-owner principals are required; human and delegated tokens are
        not supported. All responses, including errors, are not cacheable.
      tags: [Domain verification]
      security:
        - daykeeperOAuth: [daykeeper.accounts:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainVerificationInput"
      responses:
        "201":
          description: A new or exact-replayed domain verification challenge.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerificationResponse"
        "400": { $ref: "#/components/responses/DomainError" }
        "401": { $ref: "#/components/responses/DomainError" }
        "403": { $ref: "#/components/responses/DomainError" }
        "404": { $ref: "#/components/responses/DomainError" }
        "409": { $ref: "#/components/responses/DomainError" }
        "503": { $ref: "#/components/responses/DomainError" }
  "/v1/tenants/{tenantId}/domain-verifications/{verificationId}":
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/DomainVerificationId"
    get:
      operationId: getDomainVerification
      summary: Read a tenant domain verification
      description: Read durable DNS evidence without activating traffic.
      tags: [Domain verification]
      security:
        - daykeeperOAuth: [daykeeper.accounts:read]
      responses:
        "200":
          description: Domain verification evidence.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerificationResponse"
        "401": { $ref: "#/components/responses/DomainError" }
        "403": { $ref: "#/components/responses/DomainError" }
        "404": { $ref: "#/components/responses/DomainError" }
  "/v1/tenants/{tenantId}/domain-verifications/{verificationId}/verify":
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/DomainVerificationId"
    post:
      operationId: verifyDomainVerification
      summary: Verify a tenant domain through DNS
      description: |
        Re-observes the public TXT record and commits a short-lived proof
        receipt. Verification does not activate customer traffic. Machine-owner
        principals are required and all responses are not cacheable.
      tags: [Domain verification]
      security:
        - daykeeperOAuth: [daykeeper.accounts:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: Updated or already verified domain evidence.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerificationResponse"
        "400": { $ref: "#/components/responses/DomainError" }
        "401": { $ref: "#/components/responses/DomainError" }
        "403": { $ref: "#/components/responses/DomainError" }
        "404": { $ref: "#/components/responses/DomainError" }
        "409": { $ref: "#/components/responses/DomainError" }
        "503": { $ref: "#/components/responses/DomainError" }
  "/v1/tenants/{tenantId}/domain-verifications/{verificationId}/revoke":
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/DomainVerificationId"
    post:
      operationId: revokeDomainVerification
      summary: Revoke a tenant domain verification
      description: Revoke durable evidence without changing traffic activation.
      tags: [Domain verification]
      security:
        - daykeeperOAuth: [daykeeper.accounts:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: Revoked domain evidence.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerificationResponse"
        "401": { $ref: "#/components/responses/DomainError" }
        "403": { $ref: "#/components/responses/DomainError" }
        "404": { $ref: "#/components/responses/DomainError" }
  "/v1/tenants/{tenantId}/provisioning-operation":
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: getTenantProvisioningOperation
      summary: Find a tenant's provisioning operation
      description: |
        Read the latest tenant.provision operation for this tenant within the
        authenticated organization. Use this after reloading or losing an apply
        response, without creating another tenant. Both read scopes and access
        to this tenant are required. No query selectors are accepted.
        An adopted tenant without a creation operation, or an older server,
        may return 404. This read never retries work or activates customer traffic.
      tags: [Operations]
      security:
        - daykeeperOAuth:
            - daykeeper.accounts:read
            - daykeeper.provisioning:read
      responses:
        "200":
          description: Current durable creation operation, without changing its state.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/operations/{operationId}":
    parameters:
      - $ref: "#/components/parameters/OperationId"
    get:
      operationId: getOperation
      summary: Get a durable operation
      tags: [Operations]
      security:
        - daykeeperOAuth:
            - daykeeper.provisioning:read
      responses:
        "200":
          description: Current operation state and bounded step details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/operations/{operationId}/retry":
    parameters:
      - $ref: "#/components/parameters/OperationId"
    post:
      operationId: retryOperation
      summary: Retry a failed, retryable operation
      tags: [Operations]
      security:
        - daykeeperOAuth:
            - daykeeper.provisioning:apply
      responses:
        "202":
          description: The operation was queued for another bounded attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/tenants/{tenantId}/flows":
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      operationId: listTenantFlows
      summary: List a tenant's flows
      tags: [Flows]
      security:
        - daykeeperOAuth:
            - daykeeper.flows:read
      responses:
        "200":
          description: Flow list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowListResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createFlow
      summary: Create a flow and its first immutable version
      description: |
        Requires an Idempotency-Key header. The first application creates the
        draft flow and its first immutable version and answers 201 with
        `replayed: false`. Sending the same key with the exact same body again
        answers 200 with the original flow and version and `replayed: true`; no
        second flow is created, even after the flow has since changed.

        Sending the same key with a different body is rejected with
        IDEMPOTENCY_KEY_REUSED (409) and no write is applied. A slug already in
        use by another flow is still rejected with RESOURCE_CONFLICT (409).

        When a request fails without a usable response its outcome is unknown.
        Repeat it with the same key and the exact original body to learn what
        happened; do not retry an uncertain mutation under a new key. The Node
        SDK surfaces this state as `outcomeUnknown` on the raised error and will
        not retry it automatically.
      tags: [Flows]
      security:
        - daykeeperOAuth:
            - daykeeper.flows:write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlowInput"
      responses:
        "200":
          description: The exact original request was replayed; replayed is true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowMutationResultResponse"
        "201":
          description: Draft flow and immutable version one; replayed is false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowMutationResultResponse"
        "400":
          $ref: "#/components/responses/Error"
          description: The Idempotency-Key header is missing or malformed (INVALID_INPUT).
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/IdempotencyKeyReused"
        default:
          $ref: "#/components/responses/Error"
  /v1/flows:
    get:
      operationId: listFlows
      summary: List flows visible to the caller
      tags: [Flows]
      security:
        - daykeeperOAuth:
            - daykeeper.flows:read
      parameters:
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Flow list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowListResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/flows/{flowId}":
    parameters:
      - $ref: "#/components/parameters/FlowId"
    get:
      operationId: getFlow
      summary: Get a flow and its latest version
      tags: [Flows]
      security:
        - daykeeperOAuth:
            - daykeeper.flows:read
      responses:
        "200":
          description: Flow and latest immutable definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowWithVersionResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/flows/{flowId}/versions":
    parameters:
      - $ref: "#/components/parameters/FlowId"
    post:
      operationId: createFlowVersion
      summary: Create the next immutable flow version
      description: |
        Requires an Idempotency-Key header. The first application creates the
        next immutable version and answers 201 with `replayed: false`. Sending
        the same key with the exact same body again answers 200 with the
        original version and `replayed: true`; no second version is created.

        Sending the same key with a different body is rejected with
        IDEMPOTENCY_KEY_REUSED (409) and no write is applied. Optimistic
        concurrency still applies to every new key: a stale
        `expectedLatestVersion` is rejected with RESOURCE_VERSION_CONFLICT (409).

        When a request fails without a usable response its outcome is unknown.
        Repeat it with the same key and the exact original body to learn what
        happened; do not retry an uncertain mutation under a new key. The Node
        SDK surfaces this state as `outcomeUnknown` on the raised error and will
        not retry it automatically.
      tags: [Flows]
      security:
        - daykeeperOAuth:
            - daykeeper.flows:write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlowVersionInput"
      responses:
        "200":
          description: The exact original request was replayed; replayed is true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowMutationResultResponse"
        "201":
          description: Flow and newly created version; replayed is false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowMutationResultResponse"
        "400":
          $ref: "#/components/responses/Error"
          description: The Idempotency-Key header is missing or malformed (INVALID_INPUT).
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/IdempotencyKeyReused"
        default:
          $ref: "#/components/responses/Error"
  "/v1/flows/{flowId}/versions/{version}":
    parameters:
      - $ref: "#/components/parameters/FlowId"
      - $ref: "#/components/parameters/FlowVersionNumber"
    get:
      operationId: getFlowVersion
      summary: Get an immutable flow version
      tags: [Flows]
      security:
        - daykeeperOAuth:
            - daykeeper.flows:read
      responses:
        "200":
          description: Immutable flow version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowVersionResponse"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/v1/flows/{flowId}/versions/{version}/publish":
    parameters:
      - $ref: "#/components/parameters/FlowId"
      - $ref: "#/components/parameters/FlowVersionNumber"
    post:
      operationId: publishFlowVersion
      summary: Publish an immutable flow version
      description: |
        Publishing records audited desired state. The current capability reports
        flow execution as management_only; this operation does not yet execute a
        flow against customer conversations.

        Requires an Idempotency-Key header. This operation always answers 200:
        the first application publishes the version and reports
        `replayed: false`, and the same key with the exact same body answers
        with the original result and `replayed: true` without publishing again.

        Sending the same key with a different body is rejected with
        IDEMPOTENCY_KEY_REUSED (409) and no write is applied. Optimistic
        concurrency still applies to every new key: a stale
        `expectedResourceVersion` is rejected with RESOURCE_VERSION_CONFLICT
        (409).

        When a request fails without a usable response its outcome is unknown.
        Repeat it with the same key and the exact original body to learn what
        happened; do not retry an uncertain mutation under a new key. The Node
        SDK surfaces this state as `outcomeUnknown` on the raised error and will
        not retry it automatically.
      tags: [Flows]
      security:
        - daykeeperOAuth:
            - daykeeper.flows:publish
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishFlowVersionInput"
      responses:
        "200":
          description: |
            Flow with the selected published version. replayed is true when the
            same key already published this exact request, and false when this
            request performed the publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowMutationResultResponse"
        "400":
          $ref: "#/components/responses/Error"
          description: The Idempotency-Key header is missing or malformed (INVALID_INPUT).
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/IdempotencyKeyReused"
        default:
          $ref: "#/components/responses/Error"
  /v1/machine-enrollments/challenges:
    post:
      operationId: createMachineEnrollmentChallenge
      summary: Create a signed machine enrollment challenge
      description: |
        Creates a short-lived challenge for a machine workspace enrollment.
        This endpoint uses signed body proofs and deliberately accepts neither
        bearer authorization nor browser credentials.
      tags: [Agent credentials]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineEnrollmentInput"
      responses:
        "201":
          description: A newly created enrollment challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineChallenge"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/machine-enrollments:
    post:
      operationId: enrollMachineWorkspace
      summary: Enroll a machine workspace with a signed proof
      tags: [Agent credentials]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineProofInput"
      responses:
        "201":
          description: A workspace was newly allocated and a credential issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineEnrollmentResult"
        "200":
          description: The original enrollment result was replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineEnrollmentResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/machine-credential-rotations/challenges:
    post:
      operationId: createMachineCredentialRotationChallenge
      summary: Create a signed machine credential rotation challenge
      tags: [Agent credentials]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineRotationInput"
      responses:
        "201":
          description: A newly created credential rotation challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineChallenge"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/machine-credential-rotations:
    post:
      operationId: rotateMachineCredential
      summary: Rotate a machine credential with a signed proof
      tags: [Agent credentials]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineProofInput"
      responses:
        "201":
          description: A new machine credential was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineRotationResult"
        "200":
          description: The original rotation result was replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineRotationResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/machine-credential-rotations/current:
    post:
      operationId: inspectMachineCredential
      summary: Inspect the current machine credential with a signed proof
      tags: [Agent credentials]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineProofInput"
      responses:
        "200":
          description: Current machine credential metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineCredentialMetadata"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    daykeeperOAuth:
      type: oauth2
      description: Short-lived, audience-bound Daykeeper OAuth access token.
      flows:
        clientCredentials:
          tokenUrl: https://api.daykeeper.example/oauth/token
          scopes:
            daykeeper.accounts:read: Read organizations and tenants.
            daykeeper.accounts:write: Plan organization and tenant changes.
            daykeeper.billing:read: Read organization-wide usage and billing status.
            daykeeper.credentials:read: List organization agent credential metadata.
            daykeeper.credentials:write: Create and revoke organization agent credentials as a human owner.
            daykeeper.flows:read: Read flow metadata and versions.
            daykeeper.flows:write: Create flows and immutable versions.
            daykeeper.flows:publish: Publish reviewed flow versions.
            daykeeper.provisioning:read: Read operations and channel readiness.
            daykeeper.provisioning:apply: Apply and retry provisioning plans.
            daykeeper.customer-sessions:write: Mint tenant-bound customer session tokens.
            daykeeper.lifecycle:write: Mint tokens for tenant lifecycle messages.
            daykeeper.customers:delete: Mint target-bound customer erasure tokens.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A caller-generated key reused only for an exact logical mutation. The
        key is bound to the request the first time it is applied. Repeating that
        exact request with the same key returns the stored original result
        instead of writing again, and the operation reports the repeat as a
        replay. Reusing the key for a different request is rejected and no write
        is applied. A missing or malformed key is rejected with INVALID_INPUT
        (400). Use the same key to reconcile a request whose outcome is unknown;
        do not retry an uncertain mutation under a new key.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]{16,128}$"
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FlowId:
      name: flowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FlowVersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AgentCredentialId:
      name: agentCredentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DomainVerificationId:
      name: verificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    IdempotencyKeyReused:
      description: |
        The idempotency key is already bound to a different request, or the
        mutation conflicts with current state. IDEMPOTENCY_KEY_REUSED is never
        retryable under the same key and no write was applied; resend the exact
        original request under that key, or start a new mutation under a new
        key. Existing flow conflict codes still apply.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            idempotencyKeyReused:
              value:
                error:
                  code: IDEMPOTENCY_KEY_REUSED
                  message: The idempotency key is already bound to another request
                  retryable: false
                  nextActions:
                    - use_new_idempotency_key
                  correlationId: 10000000-0000-4000-8000-000000000002
    Error:
      description: Structured Daykeeper error. Resource denials do not disclose cross-tenant existence.
      headers:
        X-Request-Id:
          description: Correlation identifier shared with support and audit logs.
          schema:
            type: string
        Retry-After:
          description: Seconds to wait when the response is retryable and rate limited.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DomainError:
      description: Domain verification error; never cache this response.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
        X-Request-Id:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Capabilities:
      type: object
      # Response envelope: open so older clients tolerate new fields.
      additionalProperties: true
      required: [apiVersion, emailChannels, customerSessions, flows]
      properties:
        apiVersion:
          type: string
          const: v1
        emailChannels:
          type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled:
              type: boolean
        websiteInboxes:
          type: object
          additionalProperties: false
          description: Optional on older servers. Absent or disabled means website settings are not supported.
          required: [enabled, trafficActivation]
          properties:
            enabled:
              type: boolean
            trafficActivation:
              type: boolean
              description: Whether self-serve traffic activation is implemented and enabled. Preparation alone is insufficient.
        customerSessions:
          type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled:
              type: boolean
        domainVerifications:
          type: object
          additionalProperties: false
          description: Optional on older servers. DNS evidence does not activate traffic.
          required: [enabled, authentication, trafficActivation]
          properties:
            enabled:
              type: boolean
            authentication:
              type: string
              const: machine_owner
            trafficActivation:
              type: boolean
              const: false
        usage:
          type: object
          additionalProperties: false
          description: Optional on older servers. Inspection support does not imply scope, an assigned allowance, or traffic readiness.
          required: [inspection, kind, scope]
          properties:
            inspection:
              type: boolean
              const: true
            kind:
              type: string
              const: resource_safety
            scope:
              type: string
              const: organization
        agentCredentials:
          type: object
          additionalProperties: false
          description: Optional on older servers. Enabled discovery does not grant owner authority or credential scopes.
          required: [enabled, reveal, maximumValidityDays]
          properties:
            enabled:
              type: boolean
            reveal:
              type: string
              const: once
            maximumValidityDays:
              type: integer
              const: 90
        flows:
          type: object
          additionalProperties: false
          required: [schemaVersion, execution]
          properties:
            schemaVersion:
              type: string
              const: 2026-08-01
            execution:
              type: string
              const: management_only
    EntitlementPolicy:
      type: object
      additionalProperties: false
      description: |
        Immutable, versioned internal admission policy. The current
        free-2026-08-31 policy permits one persisted tenant per organization.
        That allowance is provisional, not approved pricing or a promise of
        message, storage, channel, signup, or billing capabilities. Read the
        returned tenantLimit rather than hardcoding the current example value.
      required: [version, plan, provisional, tenantLimit]
      properties:
        version:
          type: string
          description: Immutable policy version; distinct from assignmentVersion.
          examples: [free-2026-08-31]
        plan:
          type: string
          const: free
        provisional:
          type: boolean
          const: true
        tenantLimit:
          type: integer
          minimum: 1
          examples: [1]
    TenantAdmissionDenialCode:
      type: string
      description: |
        Stable tenant-admission denial code. ENTITLEMENT_REQUIRED means no
        assignment; ENTITLEMENT_INACTIVE means the assignment is revoked;
        TENANT_QUOTA_EXCEEDED means persisted tenant occupancy meets or exceeds
        the assigned limit. New codes may be added; an unknown denial must not
        be treated as permission to provision.
      enum:
        - ENTITLEMENT_REQUIRED
        - ENTITLEMENT_INACTIVE
        - TENANT_QUOTA_EXCEEDED
    TenantAdmissionDenial:
      type: object
      additionalProperties: false
      required: [code, retryable, nextActions]
      properties:
        code:
          $ref: "#/components/schemas/TenantAdmissionDenialCode"
        retryable:
          type: boolean
          const: false
        nextActions:
          type: array
          description: |
            Suggested recovery actions. Current policy denials return
            inspect_entitlements and contact_organization_owner.
          items:
            type: string
          examples:
            - [inspect_entitlements, contact_organization_owner]
    TenantProvisioningEntitlement:
      type: object
      additionalProperties: false
      required: [enforced, allowed, used, limit, remaining, denial]
      properties:
        enforced:
          type: boolean
          const: true
        allowed:
          type: boolean
          description: Whether a new tenant can currently be admitted; not a reservation.
        used:
          type: integer
          minimum: 0
          description: Organization-wide persisted tenant count, regardless of tenant state.
        limit:
          type: [integer, "null"]
          minimum: 1
          description: Assigned tenant limit, or null when no entitlement is assigned.
        remaining:
          type: [integer, "null"]
          minimum: 0
          description: |
            max(0, limit - used), or null without an assignment. Remaining
            capacity alone does not authorize provisioning of a revoked plan.
        denial:
          description: Null only when admission is currently allowed.
          anyOf:
            - $ref: "#/components/schemas/TenantAdmissionDenial"
            - type: "null"
    EntitlementStatus:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - state
        - assignmentVersion
        - policy
        - tenantProvisioning
        - metering
      properties:
        organizationId:
          type: string
          format: uuid
          description: Organization derived from the authenticated principal.
        state:
          type: string
          enum: [unconfigured, active, revoked]
        assignmentVersion:
          type: [integer, "null"]
          minimum: 1
          description: Monotonic assignment version, or null without an assignment.
        policy:
          anyOf:
            - $ref: "#/components/schemas/EntitlementPolicy"
            - type: "null"
        tenantProvisioning:
          $ref: "#/components/schemas/TenantProvisioningEntitlement"
        metering:
          type: object
          additionalProperties: false
          deprecated: true
          description: Legacy admission-only placeholders. These do not inspect optional provider enforcement; use /v1/usage for recorded resource counters, not traffic readiness.
          required: [conversations, storage]
          properties:
            conversations:
              type: string
              const: not_enforced
            storage:
              type: string
              const: not_enforced
    UsageResourceStatus:
      type: object
      additionalProperties: false
      required: [used, limit, remaining, limitReached]
      properties:
        used:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Committed records counted in this UTC period; may exceed a subsequently reduced allowance.
        limit:
          type: [integer, "null"]
          minimum: 0
          maximum: 100000000
          description: Assigned provisional ceiling; null means unconfigured, never unlimited.
        remaining:
          type: [integer, "null"]
          minimum: 0
          maximum: 100000000
          description: max(0, limit - used), or null when unconfigured. Not permission to write.
        limitReached:
          type: [boolean, "null"]
          description: used >= limit, or null when unconfigured. Zero allowance is reached even at zero usage.
    UsageStatus:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          kind,
          aggregation,
          asOf,
          period,
          state,
          assignmentVersion,
          policy,
          resources,
          writeAdmission,
          nextActions,
        ]
      properties:
        organizationId:
          type: string
          format: uuid
        kind:
          type: string
          const: resource_safety
        aggregation:
          type: string
          const: organization_single_cell
        asOf:
          type: string
          format: date-time
          description: Database statement time for this single committed snapshot.
        period:
          type: object
          additionalProperties: false
          required: [startsAt, endsAt, timezone]
          properties:
            startsAt:
              type: string
              format: date-time
              description: Inclusive first day of the current UTC calendar month.
            endsAt:
              type: string
              format: date-time
              description: Exclusive first day of the next UTC month, not a retry guarantee.
            timezone:
              type: string
              const: UTC
        state:
          type: string
          enum: [unconfigured, active, paused]
        assignmentVersion:
          type: [integer, "null"]
          minimum: 1
          maximum: 9007199254740991
        policy:
          anyOf:
            - type: object
              additionalProperties: false
              required: [version, provisional]
              properties:
                version:
                  type: string
                  minLength: 1
                  maxLength: 100
                provisional:
                  type: boolean
                  const: true
            - type: "null"
        resources:
          type: object
          additionalProperties: false
          required: [contactRecords, conversationRecords, messageRecords]
          properties:
            contactRecords:
              $ref: "#/components/schemas/UsageResourceStatus"
            conversationRecords:
              $ref: "#/components/schemas/UsageResourceStatus"
            messageRecords:
              $ref: "#/components/schemas/UsageResourceStatus"
        writeAdmission:
          type: string
          const: not_evaluated
        nextActions:
          type: array
          items:
            type: string
          description: Recovery hints for people and agents; never automatic authority to mutate policy.
    DomainVerificationInput:
      type: object
      additionalProperties: false
      required: [origin]
      properties:
        origin:
          type: string
          maxLength: 2048
          pattern: '^https://[^/?#@\s\\*;,]+$'
          description: Exact canonical HTTPS origin; no path, query, fragment, wildcard, credentials, or IP literal.
    EmptyObject:
      type: object
      additionalProperties: false
    DomainVerificationDns:
      type: object
      additionalProperties: false
      required: [type, name, value]
      properties:
        type:
          type: string
          const: TXT
        name:
          type: string
          minLength: 1
          maxLength: 253
        value:
          type: string
          minLength: 1
          maxLength: 4096
    DomainVerification:
      type: object
      additionalProperties: false
      required:
        [
          challengeId,
          tenantId,
          origin,
          state,
          dns,
          expiresAt,
          verifiedAt,
          revokedAt,
        ]
      properties:
        challengeId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        origin:
          type: string
          maxLength: 2048
          pattern: '^https://[^/?#@\s\\*;,]+$'
        state:
          type: string
          enum: [pending, verified, expired, revoked]
        dns:
          $ref: "#/components/schemas/DomainVerificationDns"
        expiresAt:
          type: integer
          format: int64
          minimum: 0
        verifiedAt:
          type: [integer, "null"]
          format: int64
          minimum: 0
        revokedAt:
          type: [integer, "null"]
          format: int64
          minimum: 0
    TenantSpec:
      type: object
      # Returned inside Tenant and TenantPlan, so it stays open for older clients.
      additionalProperties: true
      required: [name, slug, locale]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
        locale:
          type: string
          minLength: 2
          maxLength: 35
        region:
          type: string
          minLength: 2
          maxLength: 35
        supportEmail:
          type: string
          format: email
          maxLength: 254
        website:
          $ref: "#/components/schemas/WebsiteInboxSpec"
        administrator:
          description: Optional legacy contact metadata; it does not establish ownership or access.
          type: object
          additionalProperties: false
          required: [name, email]
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 120
            email:
              type: string
              format: email
              maxLength: 254
    WebsiteInboxSpec:
      type: object
      additionalProperties: false
      required: [websiteUrl]
      description: |
        Exact HTTPS root URLs only; the scheme must be lowercase https. No
        credentials, query, fragment, path, whitespace, delimiter or wildcard.
        Hostnames must be valid DNS names or IP literals. The server normalizes default ports, host case and a trailing
        slash. allowedOrigins defaults to the website origin; when supplied it
        must include that origin and contain no duplicates after normalization.
        Origins are returned in sorted canonical form. Domain settings are
        not a substitute for signed customer identity or server authorization.
      properties:
        websiteUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://[^/?#@\s\\*;,]+/?$'
        allowedOrigins:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uri
            maxLength: 2048
            pattern: '^https://[^/?#@\s\\*;,]+/?$'
    WebsiteChannel:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          tenantId,
          spec,
          state,
          trafficEnabled,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        spec:
          $ref: "#/components/schemas/WebsiteInboxSpec"
        state:
          type: string
          description: Extensible observed state. Current values are provisioning, prepared, and degraded. Treat unknown states as not ready; always inspect trafficEnabled independently.
          examples: [prepared]
        trafficEnabled:
          type: boolean
          description: False until the complete activation boundary is implemented and verified. A succeeded provisioning operation alone does not make this true.
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Tenant:
      type: object
      additionalProperties: false
      required: [id, organizationId, spec, state, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        spec:
          $ref: "#/components/schemas/TenantSpec"
        state:
          type: string
          enum:
            [
              planned,
              provisioning,
              awaiting_channel,
              ready,
              degraded,
              suspended,
              deleting,
            ]
        version:
          type: integer
          minimum: 1
        cellId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCustomerSessionInput:
      type: object
      additionalProperties: false
      required: [purpose, subject]
      properties:
        purpose:
          type: string
          enum: [customer, lifecycle, erasure]
        subject:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: [string, "null"]
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 120
        locale:
          type: string
          minLength: 2
          maxLength: 35
          description: Required by customer and lifecycle sessions. Omit for erasure sessions so no customer context crosses the erasure boundary.
        country:
          type: [string, "null"]
          maxLength: 100
          description: Optional ISO 3166-1 alpha-2 country. Invalid values are ignored rather than asserted onto the customer profile.
        isPaid:
          type: boolean
          description: Presentation context only; never an entitlement grant. Omit when unknown so an existing customer profile is not overwritten.
        paymentProvider:
          type: string
          enum: [stripe, apple_iap, android_iap, none]
          description: Omit when unknown. The explicit none value means the caller knows the customer has no payment provider.
        erasureTargetHash:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Required only for the erasure purpose.
    CustomerSession:
      type: object
      additionalProperties: false
      required: [token, tokenType, purpose, expiresAt]
      properties:
        token:
          type: string
          minLength: 64
          description: Sensitive short-lived bearer token; never log or persist it.
        tokenType:
          type: string
          const: Bearer
        purpose:
          type: string
          enum: [customer, lifecycle, erasure]
        expiresAt:
          type: string
          format: date-time
    PlanChange:
      type: object
      additionalProperties: false
      required: [action, resourceType, summary, irreversible]
      properties:
        action:
          type: string
          enum: [create, update, delete]
        resourceType:
          type: string
        resourceId:
          type: string
        summary:
          type: string
        irreversible:
          type: boolean
    TenantPlan:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          kind,
          spec,
          changes,
          requiredScopes,
          warnings,
          version,
          createdAt,
          expiresAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        kind:
          type: string
          const: tenant.create
        spec:
          $ref: "#/components/schemas/TenantSpec"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/PlanChange"
        requiredScopes:
          type: array
          items:
            $ref: "#/components/schemas/DaykeeperScope"
        warnings:
          type: array
          items:
            type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        consumedAt:
          type: string
          format: date-time
    ApplyPlanInput:
      type: object
      additionalProperties: false
      required: [planId, planVersion]
      properties:
        planId:
          type: string
          format: uuid
        planVersion:
          type: integer
          minimum: 1
    EmailChannelSpec:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address:
          type: string
          format: email
          maxLength: 254
        region:
          type: string
          enum: [us-east-1, eu-west-1, sa-east-1, ap-northeast-1]
    DnsRecord:
      type: object
      additionalProperties: false
      required: [record, name, type, value, status]
      properties:
        record:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [MX, TXT, CNAME]
        value:
          type: string
        status:
          type: string
          enum: [not_started, pending, verified, failed]
        priority:
          type: integer
        ttl:
          type: string
    EmailChannelVerification:
      type: object
      additionalProperties: false
      required: [sending, receiving, inboundRoundTrip, outboundRoundTrip]
      properties:
        sending:
          type: boolean
        receiving:
          type: boolean
        inboundRoundTrip:
          type: boolean
        outboundRoundTrip:
          type: boolean
        lastCheckedAt:
          type: string
          format: date-time
    EmailChannel:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          tenantId,
          spec,
          domain,
          provider,
          state,
          dnsRecords,
          verification,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        spec:
          $ref: "#/components/schemas/EmailChannelSpec"
        domain:
          type: string
        provider:
          type: string
          const: resend
        state:
          type: string
          enum:
            [
              provisioning,
              pending_dns,
              verifying,
              pending_round_trip,
              ready,
              degraded,
            ]
        dnsRecords:
          type: array
          items:
            $ref: "#/components/schemas/DnsRecord"
        verification:
          $ref: "#/components/schemas/EmailChannelVerification"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EmailChannelPlan:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          tenantId,
          kind,
          spec,
          changes,
          requiredScopes,
          warnings,
          version,
          createdAt,
          expiresAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        kind:
          type: string
          const: channel.email.configure
        spec:
          $ref: "#/components/schemas/EmailChannelSpec"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/PlanChange"
        requiredScopes:
          type: array
          items:
            $ref: "#/components/schemas/DaykeeperScope"
        warnings:
          type: array
          items:
            type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        consumedAt:
          type: string
          format: date-time
    OperationError:
      type: object
      additionalProperties: false
      required: [code, message, retryable, nextActions]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        nextActions:
          type: array
          items:
            type: string
    OperationStep:
      type: object
      additionalProperties: false
      required: [name, state, attempts]
      properties:
        name:
          type: string
        state:
          type: string
          enum: [pending, running, succeeded, failed]
        attempts:
          type: integer
          minimum: 0
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/OperationError"
    Operation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          tenantId,
          kind,
          state,
          correlationId,
          steps,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [tenant.provision, channel.email.configure]
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        correlationId:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OperationStep"
        error:
          $ref: "#/components/schemas/OperationError"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplyTenantResult:
      type: object
      additionalProperties: false
      required: [tenant, operation, replayed]
      properties:
        tenant:
          $ref: "#/components/schemas/Tenant"
        operation:
          $ref: "#/components/schemas/Operation"
        replayed:
          type: boolean
    ApplyEmailChannelResult:
      type: object
      additionalProperties: false
      required: [channel, operation, replayed]
      properties:
        channel:
          $ref: "#/components/schemas/EmailChannel"
        operation:
          $ref: "#/components/schemas/Operation"
        replayed:
          type: boolean
    FlowCondition:
      type: object
      additionalProperties: false
      required: [field, operator, value]
      properties:
        field:
          type: string
          enum: [contact.email_domain, conversation.tag, message.text]
        operator:
          type: string
          enum: [equals, contains, ends_with]
        value:
          type: string
          minLength: 1
          maxLength: 500
    FlowAction:
      oneOf:
        - $ref: "#/components/schemas/ReplyAction"
        - $ref: "#/components/schemas/TagAction"
        - $ref: "#/components/schemas/HandoffAction"
        - $ref: "#/components/schemas/PriorityAction"
    ReplyAction:
      type: object
      additionalProperties: false
      required: [id, type, text]
      properties:
        id:
          $ref: "#/components/schemas/FlowActionId"
        type:
          type: string
          const: reply
        text:
          type: string
          minLength: 1
          maxLength: 4000
    TagAction:
      type: object
      additionalProperties: false
      required: [id, type, tag]
      properties:
        id:
          $ref: "#/components/schemas/FlowActionId"
        type:
          type: string
          const: tag
        tag:
          type: string
          minLength: 1
          maxLength: 64
    HandoffAction:
      type: object
      additionalProperties: false
      required: [id, type, target]
      properties:
        id:
          $ref: "#/components/schemas/FlowActionId"
        type:
          type: string
          const: handoff
        target:
          type: string
          enum: [agent, human, hybrid]
    PriorityAction:
      type: object
      additionalProperties: false
      required: [id, type, priority]
      properties:
        id:
          $ref: "#/components/schemas/FlowActionId"
        type:
          type: string
          const: set_priority
        priority:
          type: string
          enum: [low, medium, high, urgent]
    FlowActionId:
      type: string
      minLength: 1
      maxLength: 64
    FlowDefinition:
      type: object
      additionalProperties: false
      required: [schemaVersion, trigger, conditions, actions]
      properties:
        schemaVersion:
          type: string
          const: 2026-08-01
        trigger:
          type: object
          additionalProperties: false
          required: [event, channel]
          properties:
            event:
              type: string
              enum: [conversation.created, message.received]
            channel:
              type: string
              const: email
        conditions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/FlowCondition"
        actions:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: "#/components/schemas/FlowAction"
    Flow:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          tenantId,
          slug,
          name,
          state,
          latestVersion,
          resourceVersion,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        state:
          type: string
          enum: [draft, published, archived]
        latestVersion:
          type: integer
          minimum: 1
        publishedVersion:
          type: integer
          minimum: 1
        resourceVersion:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FlowVersion:
      type: object
      additionalProperties: false
      required:
        [
          flowId,
          organizationId,
          tenantId,
          version,
          definition,
          contentHash,
          createdBy,
          createdAt,
        ]
      properties:
        flowId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        definition:
          $ref: "#/components/schemas/FlowDefinition"
        contentHash:
          type: string
        createdBy:
          type: object
          additionalProperties: false
          required: [actorId, actorType]
          properties:
            actorId:
              type: string
            actorType:
              type: string
              enum: [human, agent, service]
        createdAt:
          type: string
          format: date-time
    FlowWithVersion:
      type: object
      additionalProperties: false
      required: [flow, version]
      properties:
        flow:
          $ref: "#/components/schemas/Flow"
        version:
          $ref: "#/components/schemas/FlowVersion"
    FlowMutationResult:
      type: object
      # Response envelope: open so older clients tolerate new fields.
      additionalProperties: true
      required: [flow, version, replayed]
      properties:
        flow:
          $ref: "#/components/schemas/Flow"
        version:
          $ref: "#/components/schemas/FlowVersion"
        replayed:
          type: boolean
          description: |
            True when the stored result of an earlier identical request under
            the same idempotency key was returned and no write was applied.
    CreateFlowInput:
      type: object
      additionalProperties: false
      required: [name, slug, definition]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
        description:
          type: string
          minLength: 1
          maxLength: 500
        definition:
          $ref: "#/components/schemas/FlowDefinition"
    CreateFlowVersionInput:
      type: object
      additionalProperties: false
      required: [expectedLatestVersion, definition]
      properties:
        expectedLatestVersion:
          type: integer
          minimum: 1
        definition:
          $ref: "#/components/schemas/FlowDefinition"
    PublishFlowVersionInput:
      type: object
      additionalProperties: false
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion:
          type: integer
          minimum: 1
    MachinePublicKey:
      type: object
      additionalProperties: false
      required: [kty, crv, x, y]
      properties:
        kty:
          type: string
          const: EC
        crv:
          type: string
          const: P-256
        x:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        y:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
    MachineEnrollmentInput:
      type: object
      additionalProperties: false
      required: [name, idempotencyKey, publicKey]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{16,128}$"
        publicKey:
          $ref: "#/components/schemas/MachinePublicKey"
    MachineChallenge:
      type: object
      additionalProperties: false
      required:
        [
          challengeId,
          audience,
          nonce,
          keyThumbprint,
          requestHash,
          createdAt,
          expiresAt,
        ]
      properties:
        challengeId:
          type: string
          format: uuid
        audience:
          type: string
          format: uri
        nonce:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        keyThumbprint:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        requestHash:
          type: string
          minLength: 64
          maxLength: 64
          pattern: "^[0-9a-f]{64}$"
        createdAt:
          type: integer
          minimum: 0
        expiresAt:
          type: integer
          minimum: 0
    MachineProofInput:
      type: object
      additionalProperties: false
      required: [challengeId, proof]
      properties:
        challengeId:
          type: string
          format: uuid
        proof:
          type: string
          minLength: 1
          maxLength: 4096
    MachineEnrollmentResult:
      type: object
      additionalProperties: false
      required:
        [
          ownerId,
          organizationId,
          organizationSlug,
          credentialIssued,
          credential,
          replayed,
          token,
        ]
      properties:
        ownerId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        organizationSlug:
          type: string
        credentialIssued:
          type: boolean
        credential:
          type: object
          additionalProperties: false
          required: [id, expiresAt, revokedAt, policyVersion]
          properties:
            id:
              type: string
              format: uuid
            expiresAt:
              type: string
              format: date-time
            revokedAt:
              type: [string, "null"]
              format: date-time
            policyVersion:
              type: string
              const: machine-onboarding-v1
        replayed:
          type: boolean
        token:
          type: [string, "null"]
          pattern: "^dk_machine_[0-9a-f]{32}_[A-Za-z0-9_-]{43}$"
    MachineRotationInput:
      type: object
      additionalProperties: false
      required: [ownerId, expectedCredentialId, intentId]
      properties:
        ownerId:
          type: string
          format: uuid
        expectedCredentialId:
          type: string
          format: uuid
        intentId:
          type: string
          format: uuid
    MachineRotationResult:
      type: object
      additionalProperties: false
      required:
        [
          ownerId,
          organizationId,
          credentialId,
          predecessorId,
          intentId,
          expiresAt,
          revokedAt,
          replayed,
          token,
        ]
      properties:
        ownerId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        credentialId:
          type: string
          format: uuid
        predecessorId:
          type: string
          format: uuid
        intentId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        replayed:
          type: boolean
        token:
          type: [string, "null"]
          pattern: "^dk_machine_[0-9a-f]{32}_[A-Za-z0-9_-]{43}$"
    MachineCredentialMetadata:
      type: object
      additionalProperties: false
      required: [ownerId, organizationId, credentialId, expiresAt, revokedAt]
      properties:
        ownerId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        credentialId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
    AgentCredentialScope:
      type: string
      description: A scope that a human owner may delegate to a headless agent credential.
      enum:
        - daykeeper.accounts:read
        - daykeeper.accounts:write
        - daykeeper.flows:read
        - daykeeper.flows:write
        - daykeeper.flows:publish
        - daykeeper.provisioning:read
        - daykeeper.provisioning:apply
        - daykeeper.billing:read
    AgentCredential:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          name,
          hint,
          scopes,
          state,
          expiresAt,
          lastUsedAt,
          revokedAt,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
          description: Organization derived from the authenticated owner.
        name:
          type: string
          minLength: 2
          maxLength: 80
        hint:
          type: string
          pattern: "^dk_agent_[0-9a-f]{8}…[A-Za-z0-9_-]{4}$"
          description: Bounded display hint; never usable as a bearer credential.
        scopes:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AgentCredentialScope"
        state:
          type: string
          enum: [active, expired, revoked]
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    AgentCredentialPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AgentCredential"
        hasMore:
          type: boolean
          description: True when older inactive history was omitted.
    CreateAgentCredentialInput:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AgentCredentialScope"
        validityDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 30
    CreateAgentCredentialResult:
      type: object
      additionalProperties: false
      description: A fresh result has a token and replayed false; a replay has token null and replayed true.
      required: [credential, token, replayed]
      properties:
        credential:
          $ref: "#/components/schemas/AgentCredential"
        token:
          type: [string, "null"]
          pattern: "^dk_agent_[0-9a-f]{32}_[A-Za-z0-9_-]{43}$"
          description: Sensitive bearer token revealed only on the original successful response. Never log or persist it outside a secret manager.
        replayed:
          type: boolean
    RevokeAgentCredentialResult:
      type: object
      additionalProperties: false
      required: [credential, replayed]
      properties:
        credential:
          $ref: "#/components/schemas/AgentCredential"
        replayed:
          type: boolean
    DaykeeperScope:
      type: string
      enum:
        - daykeeper.accounts:read
        - daykeeper.accounts:write
        - daykeeper.billing:read
        - daykeeper.credentials:read
        - daykeeper.credentials:write
        - daykeeper.flows:read
        - daykeeper.flows:write
        - daykeeper.flows:publish
        - daykeeper.provisioning:read
        - daykeeper.provisioning:apply
        - daykeeper.customer-sessions:write
        - daykeeper.lifecycle:write
        - daykeeper.customers:delete
    ErrorDetail:
      type: object
      # Response envelope: open so older clients tolerate new fields.
      additionalProperties: true
      required: [code, message, retryable, nextActions, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        nextActions:
          type: array
          items:
            type: string
        correlationId:
          type: string
        fields:
          type: array
          items:
            type: string
    ErrorResponse:

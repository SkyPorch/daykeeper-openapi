            data:
              $ref: "#/components/schemas/WebClient"
    WebClient:
      type: object
      # Response envelope: open so older clients tolerate new fields.
      additionalProperties: true
      description: |
        A tenant's web messenger settings: the websites allowed to open its
        API inbox's web messenger, and the publishable key the messenger boots
        with.
      required:
        [
          tenantId,
          state,
          allowedOrigins,
          publishableKey,
          previousKeyExpiresAt,
          greeting,
          accentColor,
          trafficEnabled,
          snippet,
          version,
        ]
      properties:
        tenantId:
          type: string
          format: uuid
        state:
          type: string
          enum: [enabled, disabled]
        allowedOrigins:
          type: array
          minItems: 1
          maxItems: 10
          description: Exact, normalized origins, sorted.
          items:
            type: string
        publishableKey:
          type: string
          pattern: "^dk_pk_[A-Za-z0-9]{32}$"
          description: |
            A public identifier, not a secret: it is embedded in the website's
            HTML. What stops another website from using it is the Origin check
            against `allowedOrigins`, made at the visitor-session exchange and at
            the gateway.
        previousKeyExpiresAt:
          type: [string, "null"]
          format: date-time
          description: While a rotated-out key still works, when it stops. Null when there is none or it has expired.
        greeting:
          type: [string, "null"]
          description: The messenger's opening line, or null for the default.
        accentColor:
          type: [string, "null"]
          pattern: "^#[0-9a-f]{6}$"
          description: Lowercase `#rrggbb`, or null for the default.
        trafficEnabled:
          type: boolean
          description: True when `state` is enabled and the tenant's API inbox is live for customer traffic.
        snippet:
          type: string
          description: |
            The HTML install snippet: it loads
            https://cdn.mydaykeeper.com/messenger/v1/messenger.js and boots the
            messenger with `publishableKey`. Paste it into every page of an
            allowed website.
        version:
          type: integer
          minimum: 1
          description: Increments on every change, including key rotation. Sent as `ETag`.
    WebClientInput:
      type: object
      additionalProperties: false
      description: The whole web messenger setting. Omitted optional fields are cleared.
      required: [state, allowedOrigins]
      properties:
        state:
          type: string
          enum: [enabled, disabled]
          description: Disabled keeps the settings and key but turns the messenger off.
        allowedOrigins:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: |
            One to ten distinct exact origins, `https://host[:port]`, with no
            path, query, fragment, credentials or wildcard (a trailing `/` is
            accepted and removed). `http://localhost`, `http://127.0.0.1` and
            `http://[::1]` (any port) are accepted only where
            `capabilities.webClients.loopbackOrigins` is true. Origins that
            are equal after normalization are duplicates and rejected.
          items:
            type: string
            minLength: 1
            maxLength: 2048
            # An https origin (DNS name or bracketed IPv6, optional port), or
            # a loopback http origin; at most one trailing slash.
            pattern: '^(?:https://(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*|\[[0-9A-Fa-f:]+\])|http://(?:localhost|127\.0\.0\.1|\[::1\]))(?::[0-9]{1,5})?/?$'
        greeting:
          type: string
          minLength: 1
          maxLength: 280
          description: |
            1 to 280 characters after trimming, with no control characters.
            Send it already trimmed. A greeting that is empty after trimming is
            rejected; omit the field to clear it.
        accentColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: A `#rrggbb` hex color, stored lowercase.
    RotateWebClientPublishableKeyInput:
      type: object
      additionalProperties: false
      required: [graceSeconds]
      properties:
        graceSeconds:
          type: integer
          minimum: 0
          maximum: 604800
          description: How long the previous key keeps working. 0 stops it at once; at most 604800 (seven days).

  /v1/workspace-claims:
    post:
      operationId: createWorkspaceClaim
      summary: Create or replay a workspace ownership claim
      description: |
        Issues an owner invitation for the authenticated machine owner's own
        organization and returns the claim together with a single-use token and
        a console claim URL. Requires a machine-owner credential with
        daykeeper.accounts:write. Human bearers and delegated agent credentials
        are rejected with SCOPE_NOT_HELD (403); there is no organization
        selector.

        Requires an Idempotency-Key header. A fresh application answers 201 with
        `replayed: false` and reveals `token` and `claimUrl` exactly once. An
        exact repeat under the same key answers 200 with `replayed: true` and
        both `token` and `claimUrl` null; no secret can be recovered. Revoke the
        pending claim and create a new one to reissue a lost URL.

        The two success bodies are separate schemas rather than one loose shape:
        201 is always `WorkspaceClaimCreated`, with a non-null token and claim
        URL and `replayed` constrained to false, and 200 is always
        `WorkspaceClaimReplayed`, with both fields null and `replayed`
        constrained to true. Neither status ever carries the other's shape, so a
        client may narrow on the status code alone.

        One pending claim exists per email per organization. A different intent
        for the same address while a claim is pending is rejected with
        INVITATION_ALREADY_PENDING (409); an address that already holds a
        membership is rejected with ALREADY_A_MEMBER (409); an idempotency key
        already bound to a different address is rejected with
        IDEMPOTENCY_KEY_REUSED (409); the hourly claim window answers
        INVITATION_LIMIT_REACHED (429); a malformed address or idempotency key
        is rejected with INVALID_INPUT (400). A machine owner that no longer
        holds the organization, or an organization that is not accepting
        members, is rejected with ORGANIZATION_ACCESS_REQUIRED (403).

        Two different limits answer 429 on these routes. The hourly claim window
        answers INVITATION_LIMIT_REACHED; the generic per-address and
        per-principal request limits answer RATE_LIMITED with a Retry-After
        header. A client should treat either as retryable after the interval.

        The claim URL carries the token in its fragment so it never reaches
        server logs or referrers; it is a secret, it is shown once, and the
        agent delivers it out of band. An installation may also be configured
        to email the link to the claimed address when a new claim is created
        (never on a replay); only such an installation adds the optional
        `emailed` field, saying whether this response did. Servers before
        1.8.0 and installations that do not email claims (the default) omit
        it, so their results keep the 1.7 shape exactly; operators must
        upgrade clients to 1.8.0 before turning claim emails on.

        When a request fails without a usable response its outcome is unknown.
        Repeat it with the same key and the exact original body to learn what
        happened; do not retry an uncertain mutation under a new key. The Node
        SDK surfaces this state as `outcomeUnknown` on the raised error and will
        not retry it automatically. All responses, including errors, are not
        cacheable.
      tags: [Workspace claims]
      security:
        - daykeeperMachineOwner: []
      x-daykeeper-required-scopes: [daykeeper.accounts:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceClaimInput"
            examples:
              claim:
                summary: Hand the workspace to a person by address
                value:
                  email: gabriel@acme.com
      responses:
        "200":
          description: The exact original request was replayed; the token and claim URL are no longer available.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceClaimReplayedResponse"
              examples:
                replayed:
                  summary: Pending claim returned without its secret
                  value:
                    data:
                      claim:
                        id: 40000000-0000-4000-8000-000000000001
                        organizationId: 10000000-0000-4000-8000-000000000001
                        email: gabriel@acme.com
                        role: owner
                        state: pending
                        expiresAt: "2026-09-13T01:00:00Z"
                        createdAt: "2026-09-10T01:00:00Z"
                        acceptedAt: null
                        revokedAt: null
                      token: null
                      claimUrl: null
                      replayed: true
        "201":
          description: A claim was created and its token and claim URL are revealed exactly once.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceClaimCreatedResponse"
              examples:
                created:
                  summary: Fresh claim with a single-use handoff URL
                  value:
                    data:
                      claim:
                        id: 40000000-0000-4000-8000-000000000001
                        organizationId: 10000000-0000-4000-8000-000000000001
                        email: gabriel@acme.com
                        role: owner
                        state: pending
                        expiresAt: "2026-09-13T01:00:00Z"
                        createdAt: "2026-09-10T01:00:00Z"
                        acceptedAt: null
                        revokedAt: null
                      token: dk_invite_2Fm4Xr7QpL0aZ9tKcVbNdHsUwEyRjMgTxPnQ1ZoAiCk
                      claimUrl: https://console.daykeeper.example/claim#token=dk_invite_2Fm4Xr7QpL0aZ9tKcVbNdHsUwEyRjMgTxPnQ1ZoAiCk
                      replayed: false
        "400":
          $ref: "#/components/responses/WorkspaceClaimError"
          description: The address or the Idempotency-Key header is malformed (INVALID_INPUT).
        "401":
          $ref: "#/components/responses/WorkspaceClaimError"
        "403":
          $ref: "#/components/responses/WorkspaceClaimError"
          description: A human bearer or agent credential was used (SCOPE_NOT_HELD), or the machine owner no longer holds this organization (ORGANIZATION_ACCESS_REQUIRED).
        "409":
          $ref: "#/components/responses/WorkspaceClaimError"
          description: |
            INVITATION_ALREADY_PENDING when a different intent for the same
            address is already pending, ALREADY_A_MEMBER when the address
            already holds a membership, or IDEMPOTENCY_KEY_REUSED when the key
            is already bound to a different address. No write was applied.
        "429":
          $ref: "#/components/responses/WorkspaceClaimRateLimited"
          description: The hourly claim window (INVITATION_LIMIT_REACHED) or the generic request limit (RATE_LIMITED); no write was applied.
        "503":
          $ref: "#/components/responses/WorkspaceClaimError"
          description: The console origin is not configured, so claims are not enabled (FEATURE_UNAVAILABLE).
        default:
          $ref: "#/components/responses/WorkspaceClaimError"
    get:
      operationId: listWorkspaceClaims
      summary: List the current organization's workspace claims
      description: |
        Requires a machine-owner credential with daykeeper.accounts:read. The
        organization comes only from the verified machine owner; no
        organization, pagination, or filter selector is accepted.

        The response returns every pending, accepted and revoked claim for the
        organization in one page, ordered newest first. Expired claims are
        hidden: a pending claim past its expiry is not listed, as in the
        existing invitation list. An accepted or revoked claim stays listed
        whatever its expiry, so the history of who took the workspace and what
        was withdrawn is readable. There is no pagination in v1 and the item
        count is not capped by the contract: the hourly issue limit on creation
        is what bounds how many claims an organization can accumulate. Tokens
        and claim URLs are never returned by this read.
      tags: [Workspace claims]
      security:
        - daykeeperMachineOwner: []
      x-daykeeper-required-scopes: [daykeeper.accounts:read]
      responses:
        "200":
          description: Every pending, accepted and revoked claim for the authenticated organization, expired claims hidden, newest first.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceClaimListResponse"
              examples:
                pending:
                  summary: One pending owner claim
                  value:
                    data:
                      items:
                        - id: 40000000-0000-4000-8000-000000000001
                          organizationId: 10000000-0000-4000-8000-000000000001
                          email: gabriel@acme.com
                          role: owner
                          state: pending
                          expiresAt: "2026-09-13T01:00:00Z"
                          createdAt: "2026-09-10T01:00:00Z"
                          acceptedAt: null
                          revokedAt: null
        "400":
          $ref: "#/components/responses/WorkspaceClaimError"
        "401":
          $ref: "#/components/responses/WorkspaceClaimError"
        "403":
          $ref: "#/components/responses/WorkspaceClaimError"
          description: A human bearer or agent credential was used (SCOPE_NOT_HELD), or the machine owner no longer holds this organization (ORGANIZATION_ACCESS_REQUIRED).
        "429":
          $ref: "#/components/responses/WorkspaceClaimRateLimited"
          description: The generic per-address or per-principal request limit (RATE_LIMITED).
        "503":
          $ref: "#/components/responses/WorkspaceClaimError"
          description: The console origin is not configured, so claims are not enabled (FEATURE_UNAVAILABLE).
        default:
          $ref: "#/components/responses/WorkspaceClaimError"
  "/v1/workspace-claims/{claimId}/revoke":
    parameters:
      - $ref: "#/components/parameters/WorkspaceClaimId"
    post:
      operationId: revokeWorkspaceClaim
      summary: Revoke a workspace ownership claim
      description: |
        Requires a machine-owner credential with daykeeper.accounts:write and
        accepts no customer configuration. Revocation invalidates the claim's
        token and is safe to repeat: a repeat returns the same revoked claim. It
        never creates, replaces, recovers, or returns a token or claim URL. A
        claim belonging to another organization is not disclosed.
      tags: [Workspace claims]
      security:
        - daykeeperMachineOwner: []
      x-daykeeper-required-scopes: [daykeeper.accounts:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: The claim is revoked, including an idempotent repeat.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceClaimResponse"
              examples:
                revoked:
                  summary: The claim after revocation
                  value:
                    data:
                      id: 40000000-0000-4000-8000-000000000001
                      organizationId: 10000000-0000-4000-8000-000000000001
                      email: gabriel@acme.com
                      role: owner
                      state: revoked
                      expiresAt: "2026-09-13T01:00:00Z"
                      createdAt: "2026-09-10T01:00:00Z"
                      acceptedAt: null
                      revokedAt: "2026-09-10T02:00:00Z"
        "400":
          $ref: "#/components/responses/WorkspaceClaimError"
        "401":
          $ref: "#/components/responses/WorkspaceClaimError"
        "403":
          $ref: "#/components/responses/WorkspaceClaimError"
          description: A human bearer or agent credential was used (SCOPE_NOT_HELD), or the machine owner no longer holds this organization (ORGANIZATION_ACCESS_REQUIRED).
        "404":
          $ref: "#/components/responses/WorkspaceClaimError"
          description: No claim with this identifier belongs to the authenticated machine owner (RESOURCE_NOT_FOUND). A claim in another organization is reported the same way rather than disclosed.
        "409":
          $ref: "#/components/responses/WorkspaceClaimError"
          description: The claim was already accepted and cannot be revoked (RESOURCE_STATE_CONFLICT).
        "429":
          $ref: "#/components/responses/WorkspaceClaimRateLimited"
          description: The generic per-address or per-principal request limit (RATE_LIMITED).
        "503":
          $ref: "#/components/responses/WorkspaceClaimError"
          description: The console origin is not configured, so claims are not enabled (FEATURE_UNAVAILABLE).
        default:
          $ref: "#/components/responses/WorkspaceClaimError"
components:
  securitySchemes:
    daykeeperServerKey:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Reveal-once Daykeeper server key (dk_agent_ prefix), held only on the backend. Enforces its organization, optional tenant restriction, granted scopes, expiry and revocation. A response to a server-key request carries a Daykeeper-Credential-Expires-At header when the key expires within 14 days. Never use in customer SDKs.
    daykeeperMachineOwner:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque machine-owner bearer credential. The operation's required Daykeeper account scope is documented on each operation.
    daykeeperOAuth:
      type: oauth2
      description: Short-lived, audience-bound Daykeeper OAuth access token.
      flows:
        clientCredentials:
          tokenUrl: https://api.daykeeper.example/oauth/token
          scopes:
            daykeeper.accounts:read: Read organizations and tenants.
            daykeeper.accounts:write: Plan organization and tenant changes.
            daykeeper.billing:read: Read organization-wide usage and billing status.
            daykeeper.credentials:read: List organization agent credential metadata.
            daykeeper.credentials:write: Create, rotate and revoke organization agent credentials as a human owner.
            daykeeper.flows:read: Read flow metadata and versions.
            daykeeper.flows:write: Create flows and immutable versions.
            daykeeper.flows:publish: Publish reviewed flow versions.
            daykeeper.provisioning:read: Read operations and channel readiness.
            daykeeper.provisioning:apply: Apply and retry provisioning plans.
            daykeeper.customer-sessions:write: Mint tenant-bound customer session tokens.
            daykeeper.lifecycle:write: Mint tokens for tenant lifecycle messages.
            daykeeper.customers:delete: Mint target-bound customer erasure tokens.
            daykeeper.conversations:read: Read tenant-scoped support conversations and messages.
            daykeeper.conversations:write: Send one tenant-scoped plain-text support reply.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A caller-generated key reused only for an exact logical mutation. The
        key is bound to the request the first time it is applied. Repeating that
        exact request with the same key returns the stored original result
        instead of writing again, and the operation reports the repeat as a
        replay. Reusing the key for a different request is rejected and no write
        is applied. A missing or malformed key is rejected with INVALID_INPUT
        (400). Use the same key to reconcile a request whose outcome is unknown;
        do not retry an uncertain mutation under a new key.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]{16,128}$"
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FlowId:
      name: flowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FlowVersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AgentCredentialId:
      name: agentCredentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebClientIfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Replace only this version of the web client: the `version` (as sent in
        `ETag`) from the last read or write. `3`, `"3"` and `W/"3"` are
        accepted. A different stored version, or no web client at all, answers
        VERSION_CONFLICT (412). A malformed value, including `*` or a list of
        versions, answers INVALID_INPUT (400). Do not combine with
        If-None-Match.
      schema:
        type: string
        # Exactly the documented forms: bare, quoted, or weak and quoted.
        pattern: '^(?:[1-9][0-9]{0,15}|"[1-9][0-9]{0,15}"|W/"[1-9][0-9]{0,15}")$'
    WebClientIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |
        `*` creates the web client only if the tenant has none. If one exists
        the request answers VERSION_CONFLICT (412) and nothing changes. Any
        other value answers INVALID_INPUT (400). Do not combine with If-Match.
        New in contract 1.7.0; older servers ignore this header.
      schema:
        type: string
        const: "*"
    DomainVerificationId:
      name: verificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    DaykeeperCredentialExpiresAt:
      description: |
        Sent only on a response to a request authenticated with a Daykeeper
        server key that expires within 14 days: the RFC 3339 instant it stops
        working. Rotate the key before then. Absent for OAuth and machine-owner
        callers, for a key that lasts until revoked, and on older servers.
      required: false
      schema:
        type: string
        format: date-time
    WebClientETag:
      description: The web client's `version` as a quoted strong entity tag, for example `"3"`. Send it back as If-Match.
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  responses:
    IdempotencyKeyReused:
      description: |
        The idempotency key is already bound to a different request, or the
        mutation conflicts with current state. IDEMPOTENCY_KEY_REUSED is never
        retryable under the same key and no write was applied; resend the exact
        original request under that key, or start a new mutation under a new
        key. Existing flow conflict codes still apply.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            idempotencyKeyReused:
              value:
                error:
                  code: IDEMPOTENCY_KEY_REUSED
                  message: The idempotency key is already bound to another request
                  retryable: false
                  nextActions:
                    - use_new_idempotency_key
                  correlationId: 10000000-0000-4000-8000-000000000002
    Error:
      description: Structured Daykeeper error. Resource denials do not disclose cross-tenant existence.
      headers:
        Daykeeper-Credential-Expires-At:
          $ref: "#/components/headers/DaykeeperCredentialExpiresAt"
        X-Request-Id:
          description: Correlation identifier shared with support and audit logs.
          schema:
            type: string
        Retry-After:
          description: Seconds to wait when the response is retryable and rate limited.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DomainError:
      description: Domain verification error; never cache this response.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
        X-Request-Id:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DomainRequestError:
      description: Domain verification request rejected; never cache this response.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
        X-Request-Id:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DomainRateLimited:
      description: Domain verification request rate limited; retry only as directed.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
        Retry-After:
          schema:
            type: integer
            minimum: 0
        X-Request-Id:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ApiInboxActivationError:
      description: API inbox activation error; never cache this response.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
        X-Request-Id:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ApiInboxActivationRequestError:
      description: API inbox activation request rejected; never cache this response.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
        X-Request-Id:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ApiInboxActivationRateLimited:
      description: API inbox activation is bounded; do not retry uncertain writes automatically.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
        Retry-After:
          schema:
            type: integer
            minimum: 1
        X-Request-Id:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    WorkspaceClaimError:
      description: Workspace claim error; never cache this response.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
        X-Request-Id:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    WorkspaceClaimRateLimited:
      description: |
        Workspace claim creation is bounded by an hourly window, which answers
        INVITATION_LIMIT_REACHED, and every claim route is also bounded by the
        generic per-address and per-principal request limits, which answer
        RATE_LIMITED with Retry-After. Do not retry an uncertain write
        automatically.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
        Retry-After:
          schema:
            type: integer
            minimum: 1
        X-Request-Id:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Profile:
      type: object
      additionalProperties: true
      required: [userId, name, email, organizationId, workspace]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        organizationId: { type: string, format: uuid }
        workspace:
          type: object
          additionalProperties: true
          required: [organizationId, organizationSlug, name]
          properties:
            organizationId: { type: string, format: uuid }
            organizationSlug: { type: string, maxLength: 120 }
            name: { type: string, maxLength: 200 }
    Workspace:
      type: object
      additionalProperties: true
      required: [organizationId, organizationSlug, name, role]
      properties:
        organizationId: { type: string, format: uuid }
        organizationSlug: { type: string, maxLength: 120 }
        name: { type: string, maxLength: 200 }
        role: { type: string, maxLength: 40 }
    WorkspaceList:
      type: object
      additionalProperties: true
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/Workspace" }
    CustomerEmail:
      type: object
      additionalProperties: true
      required:
        [
          tenantId,
          enabled,
          customSender,
          senderName,
          sendingDomain,
          deliveryEnabled,
        ]
      properties:
        tenantId: { type: string, format: uuid }
        enabled: { type: boolean }
        customSender: { type: [string, "null"], maxLength: 254 }
        senderName: { type: [string, "null"], maxLength: 200 }
        sendingDomain: { type: [string, "null"], maxLength: 253 }
        deliveryEnabled: { type: boolean }
    CustomerEmailInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    OperatorConversationPage:
      type: object
      additionalProperties: false
      required: [limit, nextCursor, hasMore]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        nextCursor: { type: [string, "null"], maxLength: 512 }
        hasMore: { type: boolean }
    OperatorConversationMessagesPage:
      type: object
      additionalProperties: false
      required: [limit, nextCursor, hasMore]
      properties:
        limit: { type: integer, minimum: 1, maximum: 200 }
        nextCursor: { type: [string, "null"], maxLength: 512 }
        hasMore: { type: boolean }
    OperatorConversationStatus:
      type: string
      enum: [open, resolved]
    OperatorConversationStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/OperatorConversationStatus" }
    OperatorConversationStatusResult:
      type: object
      additionalProperties: true
      required: [tenantId, conversationId, conversation]
      properties:
        tenantId: { type: string, format: uuid }
        conversationId:
          {
            type: integer,
            format: int64,
            minimum: 1,
            maximum: 9007199254740991,
          }
        conversation: { $ref: "#/components/schemas/OperatorConversation" }
    OperatorConversationDetail:
      type: object
      additionalProperties: false
      required: [tenantId, conversationId, conversation]
      properties:
        tenantId: { type: string, format: uuid }
        conversationId:
          {
            type: integer,
            format: int64,
            minimum: 1,
            maximum: 9007199254740991,
          }
        conversation: { $ref: "#/components/schemas/OperatorConversation" }
    OperatorConversation:
      type: object
      additionalProperties: false
      required: [id, status, preview]
      properties:
        id:
          {
            type: integer,
            format: int64,
            minimum: 1,
            maximum: 9007199254740991,
          }
        status: { type: string, maxLength: 40 }
        preview: { type: string, maxLength: 4000 }
        createdAt: { type: string, format: date-time, maxLength: 64 }
        updatedAt: { type: string, format: date-time, maxLength: 64 }
        lastActivityAt: { type: string, format: date-time, maxLength: 64 }
    OperatorMessage:
      type: object
      additionalProperties: false
      required:
        [id, conversationId, senderType, messageType, content, createdAt]
      properties:
        id:
          {
            type: integer,
            format: int64,
            minimum: 1,
            maximum: 9007199254740991,
          }
        conversationId:
          {
            type: integer,
            format: int64,
            minimum: 1,
            maximum: 9007199254740991,
          }
        senderType: { type: string, maxLength: 40 }
        messageType: { type: integer, minimum: 0, maximum: 3 }
        content: { type: string, maxLength: 16000 }
        createdAt: { type: string, maxLength: 64 }
    OperatorReplyInput:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 4000 }
    OperatorConversationList:
      type: object
      additionalProperties: true
      required: [tenantId, conversations, page]
      properties:
        tenantId: { type: string, format: uuid }
        conversations:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/OperatorConversation" }
        page: { $ref: "#/components/schemas/OperatorConversationPage" }
    OperatorConversationMessages:
      type: object
      additionalProperties: true
      required: [tenantId, conversationId, messages, page]
      properties:
        tenantId: { type: string, format: uuid }
        conversationId:
          {
            type: integer,
            format: int64,
            minimum: 1,
            maximum: 9007199254740991,
          }
        messages:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/OperatorMessage" }
        page: { $ref: "#/components/schemas/OperatorConversationMessagesPage" }
    OperatorConversationReply:
      type: object
      additionalProperties: false
      required: [tenantId, conversationId, message]
      properties:
        tenantId: { type: string, format: uuid }
        conversationId:
          {
            type: integer,
            format: int64,
            minimum: 1,
            maximum: 9007199254740991,
          }
        message: { $ref: "#/components/schemas/OperatorMessage" }
    Capabilities:
      type: object
      # Response envelope: open so older clients tolerate new fields.
      additionalProperties: true
      required: [apiVersion, emailChannels, customerSessions, flows]
      properties:
        apiVersion:
          type: string
          const: v1
        emailChannels:
          type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled:
              type: boolean
        websiteInboxes:
          type: object
          additionalProperties: false
          description: Optional on older servers. Absent or disabled means website settings are not supported.
          required: [enabled, trafficActivation]
          properties:
            enabled:
              type: boolean
            trafficActivation:
              type: boolean
              description: Whether self-serve traffic activation is implemented and enabled. Preparation alone is insufficient.
        apiInboxes:
          type: object
          additionalProperties: false
          description: API-only inbox preparation and optional traffic activation capability.
          required: [enabled, trafficActivation]
          properties:
            enabled:
              type: boolean
            trafficActivation:
              type: boolean
        customerSessions:
          type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled:
              type: boolean
        domainVerifications:
          type: object
          additionalProperties: false
          description: Optional on older servers. DNS evidence does not activate traffic.
          required: [enabled, authentication, trafficActivation]
          properties:
            enabled:
              type: boolean
            authentication:
              type: string
              const: machine_owner
            trafficActivation:
              type: boolean
              const: false
        usage:
          type: object
          additionalProperties: false
          description: Optional on older servers. Inspection support does not imply scope, an assigned allowance, or traffic readiness.
          required: [inspection, kind, scope]
          properties:
            inspection:
              type: boolean
              const: true
            kind:
              type: string
              const: resource_safety
            scope:
              type: string
              const: organization
        agentCredentials:
          type: object
          additionalProperties: true
          description: Optional on older servers. Enabled discovery does not grant owner authority or credential scopes. Open to fields added in later minor versions.
          required: [enabled, reveal, maximumValidityDays]
          properties:
            enabled:
              type: boolean
            reveal:
              type: string
              const: once
            maximumValidityDays:
              type: integer
              const: 90
            rotation:
              type: boolean
              description: Optional on older servers. True when POST /v1/agent-credentials/{agentCredentialId}/rotate is available.
        workspaceClaims:
          type: boolean
          description: |
            Optional on older servers. True when the management API can issue
            workspace ownership claims. False when the console origin setting is
            absent, in which case the claim routes answer FEATURE_UNAVAILABLE
            (503). Absent means the server predates workspace claims. Enabled
            discovery does not grant machine-owner authority or account scopes.
        webClients:
          type: object
          additionalProperties: true
          description: |
            Optional on older servers; absent means the server predates web
            clients. `enabled: false` means the web-client routes answer
            FEATURE_UNAVAILABLE (409). Open to fields added in later minor
            versions.
          required: [enabled, loopbackOrigins]
          properties:
            enabled:
              type: boolean
            loopbackOrigins:
              type: boolean
              description: True when `http://localhost`, `http://127.0.0.1` and `http://[::1]` origins are accepted, for local development.
        flows:
          type: object
          additionalProperties: false
          required: [schemaVersion, execution]
          properties:
            schemaVersion:
              type: string
              const: 2026-08-01
            execution:
              type: string
              const: management_only
    EntitlementPolicy:
      type: object
      additionalProperties: false
      description: |
        Immutable, versioned internal admission policy. The current immutable
        policy permits a bounded number of persisted
        tenants per organization. Free and paid policy plans are represented
        here for admission reporting; this field is not a billing entitlement
        or a promise of provider capabilities. Read the returned tenantLimit
        rather than hardcoding the current example value.
      required: [version, plan, provisional, tenantLimit]
      properties:
        version:
          type: string
          description: Immutable policy version; distinct from assignmentVersion.
          examples: [free-2026-08-31]
        plan:
          type: string
          enum: [free, pro, scale]
        provisional:
          type: boolean
          const: true
        tenantLimit:
          type: integer
          minimum: 1
          examples: [1]
    TenantAdmissionDenialCode:
      type: string
      description: |
        Stable tenant-admission denial code. ENTITLEMENT_REQUIRED means no
        assignment; ENTITLEMENT_INACTIVE means the assignment is revoked;
        TENANT_QUOTA_EXCEEDED means persisted tenant occupancy meets or exceeds
        the assigned limit. New codes may be added; an unknown denial must not
        be treated as permission to provision.
    TenantAdmissionDenial:
      type: object
      additionalProperties: false
      required: [code, retryable, nextActions]
      properties:
        code:
          $ref: "#/components/schemas/TenantAdmissionDenialCode"
        retryable:
          type: boolean
          const: false
        nextActions:
          type: array
          description: |
            Suggested recovery actions. Current policy denials return
            inspect_entitlements and contact_organization_owner.
          items:
            type: string
          examples:
            - [inspect_entitlements, contact_organization_owner]
    TenantProvisioningEntitlement:
      type: object
      additionalProperties: false
      required: [enforced, allowed, used, limit, remaining, denial]
      properties:
        enforced:
          type: boolean
          const: true
        allowed:
          type: boolean
          description: Whether a new tenant can currently be admitted; not a reservation.
        used:
          type: integer
          minimum: 0
          description: Organization-wide persisted tenant count, regardless of tenant state.
        limit:
          type: [integer, "null"]
          minimum: 1
          description: Assigned tenant limit, or null when no entitlement is assigned.
        remaining:
          type: [integer, "null"]
          minimum: 0
          description: |
            max(0, limit - used), or null without an assignment. Remaining
            capacity alone does not authorize provisioning of a revoked plan.
        denial:
          description: Null only when admission is currently allowed.
          anyOf:
            - $ref: "#/components/schemas/TenantAdmissionDenial"
            - type: "null"
      oneOf:
        - properties:
            enforced:
              const: true
            allowed:
              const: true
            used:
              type: integer
            limit:
              type: [integer, "null"]
            remaining:
              type: [integer, "null"]
            denial:
              type: "null"
          required: [enforced, allowed, used, limit, remaining, denial]
        - properties:
            enforced:
              const: true
            allowed:
              const: false
            used:
              type: integer
            limit:
              type: [integer, "null"]
            remaining:
              type: [integer, "null"]
            denial:
              $ref: "#/components/schemas/TenantAdmissionDenial"
          required: [enforced, allowed, used, limit, remaining, denial]
    EntitlementStatus:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - state
        - assignmentVersion
        - policy
        - tenantProvisioning
        - metering
      properties:
        organizationId:
          type: string
          format: uuid
          description: Organization derived from the authenticated principal.
        state:
          type: string
          enum: [unconfigured, active, revoked]
        assignmentVersion:
          type: [integer, "null"]
          minimum: 1
          description: Monotonic assignment version, or null without an assignment.
        policy:
          anyOf:
            - $ref: "#/components/schemas/EntitlementPolicy"
            - type: "null"
        tenantProvisioning:
          $ref: "#/components/schemas/TenantProvisioningEntitlement"
        metering:
          type: object
          additionalProperties: false
          deprecated: true
          description: Legacy admission-only placeholders. These do not inspect optional provider enforcement; use /v1/usage for recorded resource counters, not traffic readiness.
          required: [conversations, storage]
          properties:
            conversations:
              type: string
              const: not_enforced
            storage:
              type: string
              const: not_enforced
    UsageResourceStatus:
      type: object
      additionalProperties: false
      required: [used, limit, remaining, limitReached]
      properties:
        used:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Committed records counted in this UTC period; may exceed a subsequently reduced allowance.
        limit:
          type: [integer, "null"]
          minimum: 0
          maximum: 100000000
          description: Assigned provisional ceiling; null means unconfigured, never unlimited.
        remaining:
          type: [integer, "null"]
          minimum: 0
          maximum: 100000000
          description: max(0, limit - used), or null when unconfigured. Not permission to write.
        limitReached:
          type: [boolean, "null"]
          description: used >= limit, or null when unconfigured. Zero allowance is reached even at zero usage.
    UsageStatus:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          kind,
          aggregation,
          asOf,
          period,
          state,
          assignmentVersion,
          policy,
          resources,
          writeAdmission,
          nextActions,
        ]
      properties:
        organizationId:
          type: string
          format: uuid
        kind:
          type: string
          const: resource_safety
        aggregation:
          type: string
          const: organization_single_cell
        asOf:
          type: string
          format: date-time
          description: Database statement time for this single committed snapshot.
        period:
          type: object
          additionalProperties: false
          required: [startsAt, endsAt, timezone]
          properties:
            startsAt:
              type: string
              format: date-time
              description: Inclusive first day of the current UTC calendar month.
            endsAt:
              type: string
              format: date-time
              description: Exclusive first day of the next UTC month, not a retry guarantee.
            timezone:
              type: string
              const: UTC
        state:
          type: string
          enum: [unconfigured, active, paused]
        assignmentVersion:
          type: [integer, "null"]
          minimum: 1
          maximum: 9007199254740991
        policy:
          anyOf:
            - type: object
              additionalProperties: false
              required: [version, provisional]
              properties:
                version:
                  type: string
                  minLength: 1
                  maxLength: 100
                provisional:
                  type: boolean
                  const: true
            - type: "null"
        resources:
          type: object
          additionalProperties: false
          required: [contactRecords, conversationRecords, messageRecords]
          properties:
            contactRecords:
              $ref: "#/components/schemas/UsageResourceStatus"
            conversationRecords:
              $ref: "#/components/schemas/UsageResourceStatus"
            messageRecords:
              $ref: "#/components/schemas/UsageResourceStatus"
        writeAdmission:
          type: string
          const: not_evaluated
        nextActions:
          type: array
          items:
            type: string
          description: Recovery hints for people and agents; never automatic authority to mutate policy.
    DomainVerificationInput:
      type: object
      additionalProperties: false
      required: [origin]
      properties:
        origin:
          type: string
          maxLength: 2048
          pattern: '^https://[^/?#@\s\\*;,]+$'
          description: Exact canonical HTTPS origin; no path, query, fragment, wildcard, credentials, or IP literal.
    EmptyObject:
      type: object
      additionalProperties: false
    ApiInboxActivation:
      type: object
      additionalProperties: false
      required:
        [
          activationId,
          tenantId,
          channelId,
          intent,
          state,
          createdAt,
          revokedAt,
          replayed,
        ]
      properties:
        activationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        intent:
          type: string
          minLength: 16
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]{16,128}$"
        state:
          type: string
          enum: [active, revoked]
        createdAt:
          type: integer
          format: int64
          minimum: 0
        revokedAt:
          type: [integer, "null"]
          format: int64
          minimum: 0
        replayed:
          type: boolean
    DomainVerificationDns:
      type: object
      additionalProperties: false
      required: [type, name, value]
      properties:
        type:
          type: string
          const: TXT
        name:
          type: string
          minLength: 1
          maxLength: 253
        value:
          type: string
          minLength: 1
          maxLength: 4096
    DomainVerification:
      type: object
      additionalProperties: false
      required:
        [
          challengeId,
          tenantId,
          origin,
          state,
          dns,
          expiresAt,
          verifiedAt,
          revokedAt,
        ]
      properties:
        challengeId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        origin:
          type: string
          maxLength: 2048
          pattern: '^https://[^/?#@\s\\*;,]+$'
        state:
          type: string
          enum: [pending, verified, expired, revoked]
        dns:
          $ref: "#/components/schemas/DomainVerificationDns"
        expiresAt:
          type: integer
          format: int64
          minimum: 0
        verifiedAt:
          type: [integer, "null"]
          format: int64
          minimum: 0
        revokedAt:
          type: [integer, "null"]
          format: int64
          minimum: 0
    TenantSpec:
      type: object
      # Returned inside Tenant and TenantPlan, so it stays open for older clients.
      additionalProperties: true
      required: [name, slug, locale]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
        locale:
          type: string
          minLength: 2
          maxLength: 35
        region:
          type: string
          minLength: 2
          maxLength: 35
        supportEmail:
          type: string
          format: email
          maxLength: 254
        website:
          $ref: "#/components/schemas/WebsiteInboxSpec"
        inbox:
          $ref: "#/components/schemas/ApiInboxSpec"
        administrator:
          description: Optional legacy contact metadata; it does not establish ownership or access.
          type: object
          additionalProperties: false
          required: [name, email]
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 120
            email:
              type: string
              format: email
              maxLength: 254
      not:
        properties:
          website: {}
          inbox: {}
        required: [website, inbox]
    WebsiteInboxSpec:
      type: object
      additionalProperties: false
      required: [websiteUrl]
      description: |
        Exact HTTPS root URLs only; the scheme must be lowercase https. No
        credentials, query, fragment, path, whitespace, delimiter or wildcard.
        Hostnames must be valid DNS names or IP literals. The server normalizes default ports, host case and a trailing
        slash. allowedOrigins defaults to the website origin; when supplied it
        must include that origin and contain no duplicates after normalization.
        Origins are returned in sorted canonical form. Domain settings are
        not a substitute for signed customer identity or server authorization.
      properties:
        websiteUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://[^/?#@\s\\*;,]+/?$'
        allowedOrigins:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uri
            maxLength: 2048
            pattern: '^https://[^/?#@\s\\*;,]+/?$'
    ApiInboxSpec:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: api
    WebsiteChannel:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          tenantId,
          spec,
          state,
          trafficEnabled,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        spec:
          $ref: "#/components/schemas/WebsiteInboxSpec"
        state:
          type: string
          description: Extensible observed state. Current values are provisioning, prepared, and degraded. Treat unknown states as not ready; always inspect trafficEnabled independently.
          examples: [prepared]
        trafficEnabled:
          type: boolean
          description: False until the complete activation boundary is implemented and verified. A succeeded provisioning operation alone does not make this true.
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InboxChannel:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          tenantId,
          spec,
          state,
          trafficEnabled,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        spec:
          oneOf:
            - $ref: "#/components/schemas/WebsiteInboxSpec"
            - $ref: "#/components/schemas/ApiInboxSpec"
        state:
          type: string
          description: Extensible observed state; treat unknown states as not ready.
        trafficEnabled:
          type: boolean
          description: False until the complete activation boundary is implemented and verified. A succeeded provisioning operation alone does not make this true.
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Tenant:
      type: object
      additionalProperties: false
      required: [id, organizationId, spec, state, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        spec:
          $ref: "#/components/schemas/TenantSpec"
        state:
          type: string
          enum:
            [
              planned,
              provisioning,
              awaiting_channel,
              ready,
              degraded,
              suspended,
              deleting,
            ]
        version:
          type: integer
          minimum: 1
        cellId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCustomerSessionInput:
      type: object
      additionalProperties: false
      required: [purpose, subject]
      properties:
        purpose:
          type: string
          enum: [customer, lifecycle, erasure]
        subject:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: [string, "null"]
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 120
        locale:
          type: string
          minLength: 2
          maxLength: 35
          description: Required by customer and lifecycle sessions. Omit for erasure sessions so no customer context crosses the erasure boundary.
        country:
          type: [string, "null"]
          maxLength: 100
          description: Optional ISO 3166-1 alpha-2 country. Invalid values are ignored rather than asserted onto the customer profile.
        isPaid:
          type: boolean
          description: Presentation context only; never an entitlement grant. Omit when unknown so an existing customer profile is not overwritten.
        paymentProvider:
          type: string
          enum: [stripe, apple_iap, android_iap, none]
          description: Omit when unknown. The explicit none value means the caller knows the customer has no payment provider.
        erasureTargetHash:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Required only for the erasure purpose.
    CustomerSession:
      type: object
      additionalProperties: false
      required: [token, tokenType, purpose, expiresAt]
      properties:
        token:
          type: string
          minLength: 64
          description: Sensitive short-lived bearer token; never log or persist it.
        tokenType:
          type: string
          const: Bearer
        purpose:
          type: string
          enum: [customer, lifecycle, erasure]
        expiresAt:
          type: string
          format: date-time
    PlanChange:
      type: object
      additionalProperties: false
      required: [action, resourceType, summary, irreversible]
      properties:
        action:
          type: string
          enum: [create, update, delete]
        resourceType:
          type: string
        resourceId:
          type: string
        summary:
          type: string
        irreversible:
          type: boolean
    TenantPlan:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          kind,
          spec,
          changes,
          requiredScopes,
          warnings,
          version,
          createdAt,
          expiresAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        kind:
          type: string
          const: tenant.create
        spec:
          $ref: "#/components/schemas/TenantSpec"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/PlanChange"
        requiredScopes:
          type: array
          items:
            $ref: "#/components/schemas/DaykeeperScope"
        warnings:
          type: array
          items:
            type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        consumedAt:
          type: string
          format: date-time
    ApplyPlanInput:
      type: object
      additionalProperties: false
      required: [planId, planVersion]
      properties:
        planId:
          type: string
          format: uuid
        planVersion:
          type: integer
          minimum: 1
    EmailChannelSpec:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address:
          type: string
          format: email
          maxLength: 254
        region:
          type: string
          enum: [us-east-1, eu-west-1, sa-east-1, ap-northeast-1]
    DnsRecord:
      type: object
      additionalProperties: false
      required: [record, name, type, value, status]
      properties:
        record:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [MX, TXT, CNAME]
        value:
          type: string
        status:
          type: string
          enum: [not_started, pending, verified, failed]
        priority:
          type: integer
        ttl:
          type: string
    EmailChannelVerification:
      type: object
      additionalProperties: false
      required: [sending, receiving, inboundRoundTrip, outboundRoundTrip]
      properties:
        sending:
          type: boolean
        receiving:
          type: boolean
        inboundRoundTrip:
          type: boolean
        outboundRoundTrip:
          type: boolean
        lastCheckedAt:
          type: string
          format: date-time
    EmailChannel:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          tenantId,
          spec,
          domain,
          provider,
          state,
          dnsRecords,
          verification,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        spec:
          $ref: "#/components/schemas/EmailChannelSpec"
        domain:
          type: string
        provider:
          type: string
          const: resend
        state:
          type: string
          enum:
            [
              provisioning,
              pending_dns,
              verifying,
              pending_round_trip,
              ready,
              degraded,
            ]
        dnsRecords:
          type: array
          items:
            $ref: "#/components/schemas/DnsRecord"
        verification:
          $ref: "#/components/schemas/EmailChannelVerification"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EmailChannelPlan:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organizationId,
          tenantId,
          kind,
          spec,
          changes,
          requiredScopes,
          warnings,
          version,
          createdAt,
          expiresAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        kind:
